<!DOCTYPE html>
<html lang="fr">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dino Survie</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1410;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#stats{position:absolute;left:0;right:0;top:0;height:40px;display:flex;align-items:center;justify-content:space-around;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);padding:0 6px}
#stats .pill{background:none;backdrop-filter:none;padding:2px 4px;font-size:15px}
.pill{background:rgba(0,0,0,.45);border-radius:20px;padding:5px 12px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;backdrop-filter:blur(4px)}
#bRel{position:absolute;right:8px;top:150px;width:138px;padding:4px 6px;border-radius:10px;border:1px solid #f59e0b;background:rgba(0,0,0,.5);color:#fff;font-weight:800;font-size:12px;pointer-events:auto}
#lb{position:absolute;right:8px;top:48px;width:138px;background:rgba(0,0,0,.4);border-radius:12px;padding:4px;backdrop-filter:blur(4px)}
.lbrow{display:flex;align-items:center;gap:5px;padding:2px 4px;border-radius:8px;font-size:12px}
.lbrow img{width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.08)}
.lbrow .nm{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
.lbrow .sz{font-weight:800}
.lbrow.me{background:rgba(250,204,21,.28)}
#btns{position:absolute;right:12px;bottom:28px;display:flex;gap:8px;pointer-events:auto}
.rb{width:50px;height:50px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(0,0,0,.5);color:#fff;font-weight:800;font-size:10px;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;overflow:hidden}
.rb .ic{font-size:20px;line-height:1}
.rb.on{background:#16a34a;border-color:#86efac}
.rb .cd{position:absolute;inset:0;background:rgba(0,0,0,.6);transform-origin:bottom;transform:scaleY(0)}
#camBtn{pointer-events:auto;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:14px;padding:3px 8px;font-size:14px}
#endbtn{pointer-events:auto;background:rgba(127,29,29,.8);border:1px solid #fca5a5;color:#fff;border-radius:14px;padding:4px 9px;font-size:11px;font-weight:700}
#bossBox{position:absolute;top:96px;left:8px;width:calc(100% - 162px);background:rgba(40,0,0,.6);border-radius:10px;padding:4px 8px;font-size:12px;line-height:1.35;pointer-events:none;border:1px solid rgba(239,68,68,.7)}
#bossBox .bb{height:8px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden;margin:2px 0}#bossBox .bb i{display:block;height:100%;background:linear-gradient(90deg,#ef4444,#f97316)}
#bossBox .hb i{background:linear-gradient(90deg,#22c55e,#4ade80)}
#hurtFx{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(transparent 45%,rgba(220,38,38,.75));z-index:5}
.arr{display:grid;grid-template-columns:26px repeat(4,1fr);gap:4px;align-items:center;margin:4px 0}.arr .btn{padding:4px 2px;font-size:11px;line-height:1.2;margin:0;color:#111;font-weight:900}.arr .btn:disabled{opacity:.35}
#evt{position:absolute;top:48px;left:8px;max-width:calc(100% - 162px);background:rgba(0,0,0,.55);border-radius:10px;padding:4px 8px;font-size:12px;line-height:1.35;pointer-events:none;border:1px solid rgba(250,204,21,.5)}
#evt b{color:#facc15}#evt .tm{font-size:17px;font-weight:900;color:#fff}
#mini{position:absolute;left:10px;bottom:28px;width:96px;height:96px;border-radius:12px;border:2px solid rgba(255,255,255,.55);opacity:.85;pointer-events:none}
#xpbar{position:absolute;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);height:17px;background:rgba(0,0,0,.6);border-top:1px solid rgba(255,255,255,.25);pointer-events:none}#xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a855f7,#22d3ee)}
#xpTxt{position:absolute;left:0;right:0;text-align:center;bottom:env(safe-area-inset-bottom,0px);height:17px;line-height:17px;font-size:11.5px;font-weight:800;text-shadow:0 1px 2px #000,0 0 3px #000;pointer-events:none;white-space:nowrap}
#zone{position:absolute;top:104px;left:50%;transform:translateX(-50%);font-weight:800;font-size:15px;background:rgba(0,0,0,.45);padding:4px 12px;border-radius:12px;opacity:0;transition:opacity .4s}
#banner{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:6px 14px;border-radius:14px;font-weight:700;font-size:14px;text-align:center;max-width:70%}
#joy{position:absolute;z-index:3;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35)}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.55)}
#toast{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:22px;font-weight:900;text-shadow:0 2px 6px #000;opacity:0;transition:opacity .3s}
/* Screens */
.screen{position:fixed;inset:0;overflow-y:auto;padding:14px 14px 30px;background:linear-gradient(#0f2a1c,#081510)}
.screen.trans{background:linear-gradient(rgba(5,15,10,.25),rgba(5,15,10,.85))}
h1{margin:6px 0 2px;font-size:34px;letter-spacing:1px;text-align:center;text-shadow:0 3px 10px #000}
h2{margin:6px 0 10px;font-size:22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.btn{border:none;border-radius:14px;padding:12px 16px;font-weight:800;font-size:16px;color:#fff;background:#334155}
.btn.big{font-size:24px;padding:16px;width:100%;background:linear-gradient(#22c55e,#15803d);box-shadow:0 4px 0 #14532d}
.btn.y{background:linear-gradient(#f59e0b,#b45309)}
.btn.p{background:linear-gradient(#a855f7,#6b21a8)}
.btn.b{background:linear-gradient(#3b82f6,#1d4ed8)}
.btn.r{background:linear-gradient(#ef4444,#991b1b)}
.btn:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:600px){.grid{grid-template-columns:repeat(5,1fr)}}
.card{position:relative;border-radius:12px;padding:5px 5px 6px;background:#1e293b;border:3px solid #9ca3af;text-align:center;overflow:hidden}
.card img{width:100%;aspect-ratio:1;border-radius:8px;background:radial-gradient(#3f5f4a,#1a2b22);display:block}
.card .cn{font-size:12px;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cr{font-size:10px;font-weight:800;border-radius:6px;padding:1px 3px;margin-top:2px;color:#111}
.card .evo{position:absolute;top:7px;left:7px;font-size:9px;font-weight:900;padding:1px 4px;border-radius:5px;color:#111}
.card .cnt{position:absolute;top:7px;right:7px;font-size:10px;font-weight:900;background:rgba(0,0,0,.7);padding:1px 4px;border-radius:5px;color:#fff}
.card .sp{font-size:10px;margin-top:2px;opacity:.9}
.card .stars{font-size:9.5px;line-height:1.3;text-align:left;margin-top:3px;font-weight:600}
.card .rk{font-size:11px;font-weight:900;color:#facc15;margin-top:2px}
.card.sel{box-shadow:0 0 0 3px #fff,0 0 18px 4px #facc15}
.card.lock img{filter:brightness(0) opacity(.55)}
.card .ph{width:100%;aspect-ratio:1;border-radius:8px;background:#0f172a}
.card.lock .q{position:absolute;top:30%;left:0;right:0;font-size:30px;font-weight:900;opacity:.8}
.card .fus{margin-top:4px;width:100%;padding:4px;font-size:11px;border-radius:8px}
.new{position:absolute;bottom:42px;left:0;right:0;font-size:11px;font-weight:900;color:#fde047;text-shadow:0 1px 3px #000}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chip{flex:none;border-radius:16px;padding:6px 11px;font-size:13px;font-weight:700;background:#334155;border:none;color:#fff}
.chip.on{background:#facc15;color:#111}
.panel{background:rgba(0,0,0,.4);border-radius:16px;padding:12px;margin-bottom:12px}
.dxr{background:#1e293b;border-radius:10px;padding:5px 6px 6px;margin:0 0 6px;border-left:4px solid #9ca3af}
.dxn{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin:0 2px 4px;gap:6px}
.dxn b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dxn span{font-size:11px;font-weight:800;opacity:.85;flex:none}
.dx6{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.dxc{border:2px solid #9ca3af;border-radius:7px;overflow:hidden;background:#0f172a}

.dxc .ph{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#475569}
.dxc .el{font-size:7.5px;font-weight:900;color:#111;text-align:center;padding:1px 0;white-space:nowrap;overflow:hidden}
.dxc.lock{border-color:#334155!important}.dxc.lock .el{opacity:.4}
.rarh{margin:14px 0 6px;font-weight:900;font-size:16px;padding:4px 10px;border-radius:8px;display:inline-block;color:#111}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:#1e293b;border-radius:18px;padding:18px;width:100%;max-width:380px;text-align:center}
.mbox .btn{width:100%;margin-top:9px}
#hatchStage{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh}
#hatchCard{width:200px}
.shopitem{display:flex;align-items:center;gap:10px;background:#1e293b;border-radius:12px;padding:9px;margin-bottom:8px}
.shopitem .sw{width:38px;height:38px;border-radius:50%;flex:none;border:2px solid #fff}
.shopitem .tx{flex:1;font-size:14px}
.shopitem .tx b{display:block;font-size:15px}
.shopitem .btn{padding:8px 12px;font-size:13px}
.homeinfo{display:flex;gap:12px;align-items:center}
.homeinfo .card{width:120px;flex:none}
.small{font-size:12px;opacity:.8}
.bar{height:7px;border-radius:4px;background:#334155;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;background:#facc15}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#081510;gap:12px;font-weight:700}
#loading .bar{width:60%;height:10px}
</style>
</head>

function noise(x,z){return Math.sin(x*.031)*Math.cos(z*.027)*1.6+Math.sin(x*.011+z*.017)*2.2+Math.sin(x*.07+1)*Math.sin(z*.063)*.5+Math.sin(x*.19+z*.13)*.18}
function riverDist(x,z){
  const z1=Math.sin(x/55)*38+40;
  const x2=Math.sin(z/48)*30-60;
  return Math.min(Math.abs(z-z1),Math.abs(x-x2));
}
function biomeAt(x,z){
  const r=Math.hypot(x,z);
  if(r<150)return 0;
  const a=Math.atan2(z,x);
  if(a>-2.356&&a<=-0.785)return 1;
  if(a>-0.785&&a<=0.785)return 2;
  if(a>0.785&&a<=2.356)return 4; // bas : volcan
  return 3; // gauche : marais
}
const coastX=z=>-292+Math.sin(z*.05)*5+Math.sin(z*.13)*2+Math.sin(z*.021+1)*6; // bord des falaises de la côte ouest
function heightAt(x,z){
  let h=noise(x,z)*0.6+2.6;
  {const r=Math.hypot(x,z),a=Math.atan2(z,x);if(r>140&&a>-0.9&&a<0.9){const k=Math.min(1,(r-140)/40)*Math.min(1,(0.9-Math.abs(a))/.25);h+=k*(Math.pow(Math.max(0,Math.sin(x*.045+Math.sin(z*.03)*1.5)),2)*3.2+Math.sin(z*.08+x*.02)*.6)}}
  {const r=Math.hypot(x,z),a=Math.atan2(z,x),da=Math.PI-Math.abs(a);if(r>150&&a>0.95&&a<2.2){const kv=Math.min(1,(r-150)/30)*Math.min(1,Math.min(a-.95,2.2-a)/.2);h+=kv*(Math.abs(Math.sin(x*.06+Math.sin(z*.05)*2))*1.6+Math.sin(z*.11)*.4)}
   if(r>150&&da<0.7){const k=Math.min(1,(r-150)/30)*Math.min(1,(0.7-da)/.2);const pn=Math.sin(x*.075)*Math.sin(z*.068)+Math.sin(x*.031+z*.027)*.55;if(pn>.6)h-=k*Math.min(4.5,(pn-.6)*16)}}
  {const da=Math.hypot(x-ARENA.x,z-ARENA.z);if(da<ARENA.r+8){const k=Math.min(1,(ARENA.r+8-da)/8);h=h*(1-k)+2.8*k}} // sol de l'arène bien plat
  const rd=riverDist(x,z);
  {const dc=x-coastX(z);if(dc<70){const k=Math.max(0,1-dc/70);h+=k*k*(9+Math.sin(z*.07)*2.5)*Math.min(1,rd/14)}} // la terre monte vers les falaises (sauf à l'embouchure de la rivière)
  if(rd<10)h-=(10-rd)*0.55;
  {const dc=x-coastX(z);if(dc<0){const t=Math.min(1,-dc/5);h=h*(1-t)-9*t}} // au-delà de la falaise : la mer
  return h;
}

function mergeG(list){ // list of [geometry, matrix]
  let pos=[],nor=[],uv=[],idx=[],off=0;const v=new THREE.Vector3(),nm=new THREE.Matrix3();
  for(const [g0,m] of list){const g=g0.index?g0:g0;const p=g.attributes.position,n=g.attributes.normal,u=g.attributes.uv;nm.getNormalMatrix(m);
    for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i).applyMatrix4(m);pos.push(v.x,v.y,v.z);v.fromBufferAttribute(n,i).applyMatrix3(nm).normalize();nor.push(v.x,v.y,v.z);uv.push(u?u.getX(i):0,u?u.getY(i):0)}
    if(g.index)for(let i=0;i<g.index.count;i++)idx.push(g.index.getX(i)+off);else for(let i=0;i<p.count;i++)idx.push(i+off);
    off+=p.count}
  const r=new THREE.BufferGeometry();r.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));r.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));r.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));r.setIndex(idx);return r;
}

    const h=f*Math.cos(up),yy=f*Math.sin(up)-droop*t*t*len*.5;const curl=x*(1-t*.3);

}

  for(const k in cells){const arr=cells[k];const [cx,cz]=k.split('_').map(v=>(+v+.5)*CELL);
    for(const [geo,mt] of parts){const g=new THREE.BufferGeometry();g.index=geo.index;for(const a in geo.attributes)g.setAttribute(a,geo.attributes[a]);
      g.boundingSphere=new THREE.Sphere(new THREE.Vector3(cx,5,cz),CELL*.75+20);

  for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.5}
  const src=AC.createBufferSource();src.buffer=buf;src.loop=true;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;
  const g=AC.createGain();g.gain.value=0.05;src.connect(lp);lp.connect(g);g.connect(ambGain);src.start();
  // oiseaux
  setInterval(()=>{if(!S.sound||!AC)return;const t=AC.currentTime;const n=1+Math.floor(Math.random()*3);for(let k=0;k<n;k++){const o=AC.createOscillator(),gg=AC.createGain();o.type='sine';const f=2200+Math.random()*1800;o.frequency.setValueAtTime(f,t+k*.13);o.frequency.exponentialRampToValueAtTime(f*1.4,t+k*.13+.08);gg.gain.setValueAtTime(0,t+k*.13);gg.gain.linearRampToValueAtTime(.012,t+k*.13+.02);gg.gain.linearRampToValueAtTime(0,t+k*.13+.1);o.connect(gg);gg.connect(ambGain);o.start(t+k*.13);o.stop(t+k*.13+.12)}},3500);

  if(!AC||!S.sound)return;const t=AC.currentTime;const g=AC.createGain();g.connect(AC.destination);
  if(type==='eat'||type==='egg'){const o=AC.createOscillator();o.type=type==='egg'?'triangle':'square';o.frequency.setValueAtTime(type==='egg'?880:220,t);o.frequency.exponentialRampToValueAtTime(type==='egg'?1320:110,t+.08);g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.001,t+.1);o.connect(g);o.start(t);o.stop(t+.11)}
  else if(type==='roar'){const big=p||1;const len=1.3;const buf=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const s=AC.createBufferSource();s.buffer=buf;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.Q.value=2;bp.frequency.setValueAtTime(700/big,t);bp.frequency.exponentialRampToValueAtTime(180/big,t+len);
    const o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(140/big,t);o.frequency.exponentialRampToValueAtTime(60/big,t+len);const og=AC.createGain();og.gain.value=.25;
    const lfo=AC.createOscillator();lfo.frequency.value=28;const lg=AC.createGain();lg.gain.value=25/big;lfo.connect(lg);lg.connect(o.frequency);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.12);g.gain.exponentialRampToValueAtTime(.001,t+len);

  else if(type==='hatch'){const r=p||0;const o=AC.createOscillator();o.type='triangle';const f=500+r*180;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*2,t+.15);g.gain.setValueAtTime(.05+r*.02,t);g.gain.exponentialRampToValueAtTime(.001,t+.3+r*.1);o.connect(g);o.start(t);o.stop(t+.45)}

}

// ---- Événements en temps réel (24 h/24) : le planning dépend de l'heure, pas de ta partie ----
function mulb(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// planning d'une journée (UTC) : jamais deux fois le même événement d'affilée, même d'un jour à l'autre
function evtDay(d){if(EVD[d])return EVD[d];const R=mulb(d*2654435761>>>0),L=[],D0=d*86400000;let t=0,k=0,prev=null;
  for(;;){const gap=90+R()*210,rr=R();let tp;if(!prev)tp=evtType1(rr);else{const o=EVT3.filter(x=>x!==prev);tp=o[rr<.5?0:1]}
    let dur=tp==='fire'?120:60+Math.floor(R()*540);const st=t+gap;if(st+dur>86400)break;
    L.push({id:d*1000+k,tp,dur,start:D0+st*1000,end:D0+(st+dur)*1000});prev=tp;t=st+dur;k++}
  const n1=dayFirstType(d+1),last=L[L.length-1];
  if(last&&last.tp===n1){const pv=L.length>1?L[L.length-2].tp:null;last.tp=EVT3.find(x=>x!==n1&&x!==pv);if(last.tp==='fire'){last.dur=120;last.end=last.start+120000}}
  return EVD[d]=L}

function evtC(e){if(e.c)return e.c;let c={x:0,z:0};if(e.tp!=='koth'){const R2=mulb(e.id*7919+13);for(let i=0;i<60;i++){const x=(R2()*2-1)*(MAP-20),z=(R2()*2-1)*(MAP-20);if(riverDist(x,z)>10&&!inObst(x,z,8)&&!inBossZone(x,z,10)){c={x,z};break}}}return e.c=c}

function hatchMany(n,luck){ // éclosion groupée : rapide même pour des millions d'œufs

  if(n<=4000){for(let i=0;i<n;i++){const {sp,evo}=hatchOne(luck);add(sp,evo,1)}return out}
  S.pity=S.pity||{2:0,3:0,4:0,e:0};const P=S.pity,mr=maxRar(),L=luckL(luck),sl=Math.sqrt(L);let rest=n;
  const w=RAR.map((r,i)=>i>mr?0:r.p*Math.pow(L,i/3)),me=maxEvo();
  const spread=(c,evo)=>{let left=c,wl=w.reduce((a,b)=>a+b,0);for(let r=5;r>=0;r--){if(!w[r]||left<=0)continue;let k=r?binom(left,w[r]/wl):left;left-=k;wl-=w[r];const l=spr(r);let m=l.length;for(const sp of l){const h=m>1?binom(k,1/m):k;add(sp,evo,h);k-=h;m--}}};

  return out}
function hatchOne(luck){S.pity=S.pity||{2:0,3:0,4:0,e:0};const P=S.pity,mr=maxRar(),L=luckL(luck);

function dRange(){if(DRANGE)return DRANGE;DRANGE={};for(const c of DCAT){let lo=1e99,hi=0;for(const sp of SP)for(let ev=0;ev<6;ev++){const v=c.f(sp,ev,stats(sp,ev));if(v>0){if(v<lo)lo=v;if(v>hi)hi=v}}DRANGE[c.k]=[Math.log(lo),Math.log(hi)]}return DRANGE}

  return '<div class="stars">'+DCAT.map(c=>{const on=hl.indexOf(c.k)>=0;return `<div${on?' style="color:#facc15"':''}>${c.n} <b style="color:${on?'#facc15':'#e2e8f0'}">${c.t(sp,evo,s)}</b></div>`}).join('')+'</div>';
}

const RELT=[{id:'growth',n:'Croissance',i:'💪'},{id:'radius',n:'Rayon',i:'🎯'},{id:'speed',n:'Vitesse',i:'⚡'},{id:'eggs',n:'Œufs',i:'🥚'},{id:'luck',n:'Chance',i:'🍀'},{id:'all',n:'Suprême',i:'🌟'}]; // Suprême : toutes les capacités (Rex Destructeur, ou boutique de l'arène à 5 000 / 7 500 / 10 000 os)
const ALLF=.5; // la Suprême donne la moitié de la valeur, mais à toutes les capacités (un seul emplacement)
const RELS=[{n:'Petite',v:.10,c:'#9ca3af',p:60},{n:'Moyenne',v:.25,c:'#3b82f6',p:28},{n:'Grande',v:.50,c:'#a855f7',p:10},{n:'Ancienne',v:1.00,c:'#f59e0b',p:2},{n:'Mythique',v:2.00,c:'#ef4444',p:0},{n:'Suprême I',v:1.5,c:'#06b6d4',p:0},{n:'Suprême II',v:2.5,c:'#0ea5e9',p:0},{n:'Suprême III',v:5.0,c:'#e879f9',p:0}]; // Mythique et Suprêmes I-III : seulement à la boutique de l'arène (jamais dans les coffres)
const BONEP=[0,100,300,800,2000,5000,7500,10000]; // prix en 🦴 Os de boss : même 1er, il faut plusieurs boss pour acheter
function giveRelic(t,z){S.relics=S.relics||{};const k=RELT[t].id+'|'+z;S.relics[k]=(S.relics[k]||0)+1;S.relEq=S.relEq||[];if(S.relEq.length<relicSlots())S.relEq.push(k);save();return k}
const pickW=w=>{let x=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<w.length;i++){x-=w[i];if(x<=0)return i}return 0};
const RELCAP={growth:3,radius:3,speed:.6,eggs:3,luck:1}; // plafonds : +300 % (vitesse +60 %, chance +100 %)
const CHESTS=[{n:'Coffre en bois',i:'📦',p:1500,w:[60,30,9,1],c:'linear-gradient(#a16207,#713f12)'},{n:'Coffre en fer',i:'🗃️',p:5000,w:[35,40,20,5],c:'linear-gradient(#64748b,#334155)'},{n:'Coffre en or',i:'👑',p:10000,w:[10,40,38,12],c:'linear-gradient(#f59e0b,#b45309)'}];
const relicSlots=()=>Math.min(8,3+Math.floor((S.prestige||0)/3));
function relicBonus(){const b={growth:0,radius:0,speed:0,eggs:0,luck:0};((S&&S.relEq)||[]).forEach(k=>{const [t,z]=k.split('|');if(b[t]!=null)b[t]+=RELS[+z].v;else if(t==='all')for(const x in b)b[x]+=RELS[+z].v*ALLF});for(const t in b)b[t]=Math.min(RELCAP[t],b[t]);return b}
function rollRelic(small,cw){let x=Math.random()*100,z=0;const w=small?[75,22,3,0]:(cw||RELS.map(r=>r.p));const tot=w.reduce((a,b)=>a+b,0);x=Math.random()*tot;for(let i=0;i<4;i++){x-=w[i];if(x<=0){z=i;break}}
  S.relics=S.relics||{};const own=RELT.slice(0,5).map(T=>Object.keys(S.relics).filter(k=>k.startsWith(T.id+'|')).reduce((a,k)=>a+S.relics[k],0));
  const tw=own.map(n=>1/(1+n*.5)),tt=tw.reduce((a,b)=>a+b,0);let y=Math.random()*tt,t=0;for(let i=0;i<tw.length;i++){y-=tw[i];if(y<=0){t=i;break}}
  const k=RELT[t].id+'|'+z;S.relics=S.relics||{};S.relics[k]=(S.relics[k]||0)+1;
  S.relEq=S.relEq||[];if(S.relEq.length<relicSlots())S.relEq.push(k);save();return {t,z,k}}
function relicCard(k,o){const [t,z]=k.split('|'),T=RELT.find(x=>x.id===t),Z=RELS[+z];
  return `<div class="shopitem" style="border:2px solid ${Z.c}"><div class="sw" style="background:${Z.c};display:flex;align-items:center;justify-content:center;font-size:20px">${T.i}</div><div class="tx"><b>${T.n} · ${Z.n}</b>${t==='all'?'+'+Math.round(Z.v*ALLF*100)+' % à toutes les capacités':'+'+Math.round(Z.v*100)+' % '+T.n.toLowerCase()}${o.cnt?` · x${o.cnt}`:''}</div>${o.btn||''}</div>`}

  else $('back').onclick=goHome;

    const m=$('modal');m.classList.remove('hidden');const Z=RELS[r.z],T=RELT[r.t];

// ======================= COFFRES À DINOS (gemmes, jamais de Mythique) =======================
const DCHESTS=[{n:'Coffre classique',i:'📦',p:1500,k:10,w:[55,35,9,1,0],c:'linear-gradient(#a16207,#713f12)'},
 {n:'Coffre rare',i:'💠',p:5000,k:5,w:[0,40,42,15,3],c:'linear-gradient(#3b82f6,#1d4ed8)'},
 {n:'Coffre légendaire',i:'👑',p:10000,k:3,w:[0,0,35,45,20],c:'linear-gradient(#f59e0b,#b45309)'}];
function rollChestDino(w){const mr=Math.min(4,maxRar());const ww=w.slice(0,5).map((v,i)=>i>mr?0:v);
  for(let i=mr+1;i<w.length;i++)ww[mr]+=w[i]||0; // au-delà du déblocage : ramené au maximum autorisé
  const tot=ww.reduce((a,b)=>a+b,0);let x=Math.random()*tot,ri=0;for(let i=0;i<ww.length;i++){x-=ww[i];if(x<=0){ri=i;break}}
  const l=SP.filter(s=>s.r===ri);return l[Math.floor(Math.random()*l.length)]}
function openDinoChest(ci){const C=DCHESTS[ci];if(S.gems<C.p)return;S.gems-=C.p;const res=[];let dupTot=0;S.got=S.got||{};
  for(let i=0;i<C.k;i++){const sp=rollChestDino(C.w),evo=rollEvo(false),k=K(sp.id,evo);
    if(S.inv[k]){S.inv[k]++;res.push({sp,evo,n:1})}else{const isNew=!S.dex[k];S.dex[k]=1;S.inv[k]=1;S.got[k]=1;res.push({sp,evo,n:1,isNew,newInv:true})}}
  const conv=[];new Set(res.map(x=>x.sp.id)).forEach(id=>craftUp(id,conv));conv.forEach(c=>res.push({sp:SPM[c.id],evo:c.evo,n:c.n,isNew:c.isNew,newInv:c.newInv,craft:true}));
  save();showHatch(res,0,0)}

   <input id="pIn" maxlength="14" value="${(S.pseudo||'').replace(/"/g,'')}" style="width:100%;margin-top:10px;padding:12px;border-radius:12px;border:2px solid #475569;background:#0f172a;color:#fff;font-size:18px;text-align:center;user-select:text;-webkit-user-select:text">
   <button class="btn big" id="pOk2" style="font-size:18px;padding:12px">VALIDER</button><button class="btn" id="pNo2">Annuler</button></div>`;
  const inp=$('pIn');setTimeout(()=>inp.focus(),50);

// ======================= 💾 SAUVEGARDE : exporter / importer un code (passer de la version Claude à l'appli, ou changer de téléphone) =======================
function b64(u8){let t='';for(let i=0;i<u8.length;i+=0x8000)t+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(t)}
function unb64(t){const x=atob(t),u=new Uint8Array(x.length);for(let i=0;i<x.length;i++)u[i]=x.charCodeAt(i);return u}
async function packSave(){const bytes=new TextEncoder().encode(JSON.stringify(S));
  if(window.CompressionStream){const st=new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));return 'DINO1Z:'+b64(new Uint8Array(await new Response(st).arrayBuffer()))}
  return 'DINO1:'+b64(bytes)}
async function unpackSave(code){code=(code||'').trim().replace(/\s+/g,'');let bytes;
  if(code.startsWith('DINO1Z:')){if(!window.DecompressionStream)throw new Error('zip');const st=new Blob([unb64(code.slice(7))]).stream().pipeThrough(new DecompressionStream('gzip'));bytes=new Uint8Array(await new Response(st).arrayBuffer())}
  else if(code.startsWith('DINO1:'))bytes=unb64(code.slice(6));else throw new Error('format');
  const o=JSON.parse(new TextDecoder().decode(bytes));if(!o||typeof o!=='object'||!o.inv||!o.dex)throw new Error('contenu');return o}
function showSave(){const m=$('modal');m.classList.remove('hidden');
  m.innerHTML=`<div class="mbox" style="max-width:360px"><div style="font-size:36px">💾</div><h2>Ma sauvegarde</h2>
   <div class="small">Pour garder ta progression entre la version Claude et l'appli (ou sur un autre téléphone) : <b>Exporter</b> ici, puis <b>Importer</b> le code dans l'autre version.</div>
   <button class="btn" id="svExp" style="width:100%;margin-top:8px;background:linear-gradient(#22c55e,#15803d)">📤 Exporter (copier mon code)</button>
   <textarea id="svTxt" rows="4" style="width:100%;box-sizing:border-box;margin-top:8px;font-size:11px;border-radius:8px;padding:6px;background:#0b1220;color:#e5e7eb;border:1px solid #334155" placeholder="Colle ici ton code de sauvegarde pour l'importer"></textarea>
   <button class="btn y" id="svImp" style="width:100%;margin-top:6px">📥 Importer ce code</button>
   <div class="small" id="svMsg" style="margin-top:6px;min-height:18px"></div>
   <button class="btn" id="svNo" style="width:100%">Fermer</button></div>`;
  const msg=t=>{$('svMsg').innerHTML=t};
  $('svNo').onclick=()=>m.classList.add('hidden');
  $('svExp').onclick=async()=>{try{save();const c=await packSave(),ta=$('svTxt');ta.value=c;ta.focus();ta.select();let ok=false;
      try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(c);ok=true}}catch(e){}
      if(!ok){try{ok=document.execCommand('copy')}catch(e){}}
      msg(ok?'✅ Code copié. Colle-le dans l\'autre version avec « Importer ».':'Le code est dans la case : appuie longtemps dessus, « Tout sélectionner », puis « Copier ».')}catch(e){msg('❌ Impossible de créer le code.')}};
  $('svImp').onclick=async()=>{const c=$('svTxt').value;if(!c.trim()){msg('Colle d\'abord ton code dans la case.');return}
    try{const o=await unpackSave(c);
      m.innerHTML=`<div class="mbox"><div style="font-size:36px">📥</div><h2>Remplacer ta sauvegarde ?</h2><div class="small">Code trouvé : prestige ${o.prestige||0} · ${Object.keys(o.inv||{}).length} dinos différents · ${fmt(o.gems||0)} 💎 · ${fmt(o.adn||0)} 🧬.<br>Ta progression actuelle sur cet appareil sera remplacée.</div><button class="btn y big" id="svOk" style="font-size:18px;padding:12px">OUI, CHARGER</button><button class="btn" id="svBack">Annuler</button></div>`;
      $('svBack').onclick=showSave;$('svOk').onclick=()=>{S=Object.assign(defState(),o);save();location.reload()}}
    catch(e){msg('❌ Code invalide ou incomplet. Vérifie que tu as bien tout copié.')}}}
function askReset(){const m=$('modal');m.classList.remove('hidden');
  m.innerHTML=`<div class="mbox"><div style="font-size:40px">🔄</div><h2>Tout recommencer ?</h2><div class="small">Ta sauvegarde est effacée : dinos, gemmes, prestige, reliques. Tu repars du tout début.</div>
   <button class="btn r big" id="rOk" style="font-size:18px;padding:12px">OUI, TOUT EFFACER</button><button class="btn" id="rNo">Annuler</button></div>`;

function presPanel(){

   ${(S.presLog&&S.presLog.length)?'<div class="small" style="margin-top:6px">📜 Historique : '+S.presLog.map(x=>'P'+x.p+' après '+x.h+' h de jeu').join(' · ')+'</div>':''}

}
function showLab(){show('lab');S.up=S.up||{};const el=$('lab');
  el.innerHTML=`<h2>🧬 Labo d'évolution</h2><div class="panel small" style="text-align:left">Chaque partie te donne de l'🧬 <b>ADN</b> : 1 🧬 pour 10 œufs gagnés (avant ton multiplicateur), et +50 % par prestige. Les améliorations sont <b>permanentes</b> : tu les gardes à chaque prestige. Chaque niveau coûte 14 % de plus que le précédent.</div>
   <div style="text-align:center;margin:8px 0"><span class="pill" style="font-size:18px">🧬 ${fmt(S.adn||0)}</span></div>
   ${UPG.map(u=>{const l=upL(u.id),c=upCost(u,l),mx=l>=u.max,ok=!mx&&(S.adn||0)>=c;return `<div class="shopitem"><div class="sw" style="background:#14532d;display:flex;align-items:center;justify-content:center;font-size:20px">${u.i}</div><div class="tx"><b>${u.n}</b> <span style="font-size:12px;opacity:.75;white-space:nowrap">niv. ${l}/${u.max}</span><br><span class="small">+${Math.round(u.v*l*100)} % ${u.d}${mx?' (maximum)':' → +'+Math.round(u.v*(l+1)*100)+' %'}</span><div class="bar"><i style="width:${l/u.max*100}%;background:#22c55e"></i></div></div>${mx?'<button class="btn" disabled>MAX</button>':`<button class="btn" data-up="${u.id}" style="background:${ok?'linear-gradient(#22c55e,#15803d)':'#334155'};min-width:86px" ${ok?'':'disabled'}>${fmt(c)} 🧬</button>`}</div>`}).join('')}
   <button class="btn" id="labMax" style="width:100%;margin-top:6px;background:${labCanBuy()?'linear-gradient(#16a34a,#14532d)':'#334155'}" ${labCanBuy()?'':'disabled'}>⏫ TOUT AMÉLIORER (le moins cher d'abord)</button>
   <button class="btn" id="labNo" style="width:100%;margin-top:8px">⬅ Retour</button>`;

  $('labMax').onclick=()=>{let n=0;for(;;){let bu=null,bc=Infinity;for(const u of UPG){const l=upL(u.id);if(l>=u.max)continue;const c=upCost(u,l);if(c<bc){bc=c;bu=u}}if(!bu||(S.adn||0)<bc)break;S.adn-=bc;S.up[bu.id]=upL(bu.id)+1;n++}if(n){save();sfx('hatch',3)}showLab()}}

// ======================= DÉMARRAGE =======================
(async function boot(){
  resize();
  let done=0;const glbs=SP.filter(s=>s.glb);
  for(const sp of SP){
    const g=await loadGLB(sp);TEMPL[sp.id]={glb:g};done++;$('loadBar').style.width=(done/SP.length*100)+'%';
  }
  for(const pk in PRESET){const sp=SP.find(s=>s.b&&s.b.preset===pk);if(!sp)continue;const m=buildDino(sp);const b=new THREE.Box3().setFromObject(m);PRELEN[pk]=b.max.z-b.min.z}
  await dromTex().ready;
  for(const fk in FAMS){if(FAMS[fk].alias)continue;await loadFam(fk)}for(const fk in FAMS)if(FAMS[fk].alias)FAMT[fk]=FAMT[FAMS[fk].alias];
  {const now=Date.now(),gapH=S.lastSeen?(now-S.lastSeen)/3.6e6:0;if(gapH>0.25){const [id,ev]=(S.sel||STARTER).split('|');const sp=SPM[id]||SPM.lepto;
    S.awayEggs=Math.floor(Math.min(8,gapH)*300*presEggMul()*dinoXp(sp,+ev||0));S.awayH=Math.min(8,gapH)}}
  {const own=new Set(Object.keys(S.inv||{}).map(k=>k.split('|')[0]));SP.forEach(sp=>{if(own.has(sp.id))ensureProc(sp)});ensureProc(SPM[STARTER.split('|')[0]]);
   const R=mulb(77);for(let r=0;r<6;r++){const l=SP.filter(x=>x.r===r&&!x.special&&!famOf(x));for(let k=0;k<[10,8,5,3,2,1][r]&&l.length;k++){const s=l.splice(Math.floor(R()*l.length),1)[0];ensureProc(s);POOLIDS.add(s.id)}}} // une réserve de dinos prêts dès le chargement
  {const conv=[];new Set(Object.keys(S.inv||{}).map(k=>k.split('|')[0])).forEach(id=>{if(SPM[id])craftUp(id,conv)});
   if(conv.length){save();setTimeout(()=>toast('🎁 Cumul plein : '+conv.map(c=>'+'+c.n+' '+SPM[c.id].n+' '+EVO[c.evo].n).join(', ')),1500)}} // cumuls bloqués avant : convertis maintenant
  makeThumbs();
  let pc=0;await buildDecor(()=>{pc++;$('loadBar').style.width=(pc/10*100)+'%'});
  buildForms();buildNav();
  $('loading').classList.add('hidden');
  goHome();
  if(S.awayEggs>0){const n=S.awayEggs,h=S.awayH||0;S.awayEggs=0;save();const m=$('modal');m.classList.remove('hidden');
    m.innerHTML=`<div class="mbox"><div style="font-size:46px">🌙</div><h2>Pendant ton absence</h2><div>Tes dinos ont pondu <b>${fmt(n)} œufs</b> en ${h.toFixed(1)} h (max 8 h).</div><div class="small" style="margin-top:6px">Plus ton prestige et ton dino sont forts, plus ils pondent.</div><button class="btn big" id="awOk" style="font-size:18px;padding:12px">🐣 FAIRE ÉCLORE</button></div>`;
    $('awOk').onclick=()=>{m.classList.add('hidden');giftEggs(n)}}
  requestAnimationFrame(frame);
})();
