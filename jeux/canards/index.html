<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0e1a26">
<title>1 Milliard de Canards</title>
<style>
:root{--bg:#0e1a26;--panel:#152536;--card:#1e3348;--card2:#28435e;--line:#2f4c69;--txt:#f2f6fb;--mut:#97adc3;--gold:#ffd34d;--green:#47d17a;--red:#ff5d5d;--plume:#d4b0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;background:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
#hud{flex:0 0 auto;padding:6px 8px;background:linear-gradient(#0a141e,#13263a);border-bottom:1px solid var(--line)}
#goalRow{display:flex;align-items:baseline;gap:5px;font-size:15px;white-space:nowrap}
#goalRow b{font-size:19px;font-weight:900}
#goalRow .g{color:var(--mut);font-size:12px}
#pctTxt{margin-left:auto;color:var(--gold);font-size:12px;font-weight:800}
#goalBar{position:relative;height:8px;border-radius:5px;background:#08111a;margin:4px 0 6px;overflow:hidden;border:1px solid #24405a}
#goalFill{height:100%;width:0;background:linear-gradient(90deg,#f7d046,#ff9f1c);transition:width .4s}
#goalBar i{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.3)}
#chips{display:flex;gap:4px}
.chip{flex:1 1 0;min-width:0;min-height:34px;background:#08111a;border:1px solid #24405a;border-radius:9px;padding:4px 5px;font-size:12.5px;white-space:nowrap;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:3px}
.chip b{font-weight:900}
#cashChip b{color:var(--gold)}#plumeChip b{color:var(--plume)}
#dayChip{flex:1.5 1 0;font-weight:700}
#hpChip{position:relative;padding:0}
#hpFill{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,#b8222f,#ff5d5d);transition:width .2s}
#hpTxt{position:relative;font-weight:900;text-shadow:0 1px 2px #000}
.pulse{animation:pulse .35s}
@keyframes pulse{50%{transform:scale(1.1)}}
#stage{position:relative;flex:1 1 auto;min-height:120px;overflow:hidden;background:#6fc0f0}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
#bossBar{position:absolute;left:8px;right:8px;top:6px;pointer-events:none;display:none}
#bossBar.on{display:block}
#bossName{font-weight:900;font-size:12.5px;text-shadow:0 1px 3px #000;display:flex;justify-content:space-between;gap:6px}
#bossTrack{height:11px;border-radius:7px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.4);overflow:hidden;margin-top:3px}
#bossFill{height:100%;width:100%;background:linear-gradient(90deg,#ff3b3b,#ffa03b);transition:width .1s}
button.chip{font:inherit;font-size:12.5px;color:inherit}
#dayChip.skip{border-color:var(--gold);color:var(--gold);box-shadow:0 0 6px rgba(255,211,77,.45)}
#banner{position:absolute;left:0;right:0;top:28%;text-align:center;pointer-events:none;opacity:0;padding:0 10px}
#banT{font-size:25px;font-weight:900;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 14px rgba(0,0,0,.55)}
#banS{font-size:14px;font-weight:800;margin-top:4px;text-shadow:0 2px 4px rgba(0,0,0,.85)}
#banner.show{animation:ban 2.4s ease forwards}
@keyframes ban{0%{opacity:0;transform:scale(.7)}12%{opacity:1;transform:scale(1.06)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
#hint{position:absolute;left:10px;right:10px;bottom:10px;text-align:center;font-size:13px;font-weight:800;background:rgba(0,0,0,.62);border-radius:10px;padding:7px 8px;pointer-events:none;display:none}
#hint.on{display:block;animation:hb 1.6s infinite}
@keyframes hb{50%{opacity:.75}}
#sellbar{flex:0 0 auto;display:flex;gap:6px;padding:6px 8px;background:var(--panel);border-top:1px solid var(--line)}
#frz{position:relative;flex:1;min-width:0;border-radius:10px;background:#08111a;border:1px solid #24405a;overflow:hidden;display:flex;align-items:center;padding:0 10px;font-size:13px;font-weight:800;white-space:nowrap}
#frzFill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#2b6cb0,#5cc8ff);opacity:.55;transition:width .2s}
#frz span{position:relative}
#frz.full{border-color:var(--red)}#frz.full #frzFill{background:linear-gradient(90deg,#b0302b,#ff6b5c)}
#sellBtn{flex:0 0 44%;border-radius:10px;background:linear-gradient(#ffd34d,#f0a500);color:#3a2500;font-weight:900;font-size:15px;line-height:1.1;padding:6px 4px;box-shadow:0 3px 0 #a86f00}
#sellBtn small{display:block;font-size:12px;font-weight:900}
#sellBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #a86f00}
#sellBtn:disabled{filter:grayscale(.85) brightness(.7)}
#sellBtn.go{animation:pulse .8s infinite}
#tabs{flex:0 0 auto;display:flex;background:#0a141e;border-top:1px solid var(--line)}
#tabs button{flex:1;padding:6px 0 5px;font-size:18px;line-height:1;color:var(--mut);border-top:3px solid transparent;position:relative}
#tabs button span{display:block;font-size:11px;margin-top:2px;font-weight:800}
#tabs button.on{color:#fff;border-top-color:var(--gold);background:#13263a}
#tabs .dot{position:absolute;top:4px;right:20%;width:9px;height:9px;border-radius:50%;background:var(--green);display:none;box-shadow:0 0 6px var(--green)}
#tabs .dot.on{display:block}
#panel{flex:0 0 auto;height:clamp(130px,31vh,330px);overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--panel);padding:6px 8px calc(10px + env(safe-area-inset-bottom))}
.ph{display:flex;align-items:center;justify-content:space-between;margin:2px 0 6px;gap:6px}
.ph h3{margin:0;font-size:13px;color:var(--mut);font-weight:900;text-transform:uppercase;letter-spacing:.4px}
.amt{display:flex;gap:4px}
.amt button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:900;color:var(--mut)}
.amt button.on{background:var(--gold);color:#3a2500;border-color:var(--gold)}
.card{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:7px 8px;margin-bottom:6px}
.card .ic{flex:0 0 40px;height:40px;border-radius:9px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:21px;overflow:hidden}
.card .ic img{width:38px;height:auto}
.card .mid{flex:1;min-width:0}
.card .nm{font-weight:900;font-size:14px}
.card .lv{color:var(--mut);font-weight:700;font-size:12px}
.card .ds{font-size:12px;color:var(--mut);margin-top:2px;line-height:1.3}
.card .ds b{color:#e6eef6}
.buy{flex:0 0 auto;min-width:86px;border-radius:9px;padding:11px 8px;background:linear-gradient(#4fe08a,#26a85a);color:#062b14;font-weight:900;font-size:13px;box-shadow:0 2px 0 #17703b;line-height:1.1;text-align:center}
.buy small{display:block;font-size:10px;font-weight:900;opacity:.85}
.buy:active{transform:translateY(2px);box-shadow:none}
.buy.no{background:#33475c;color:#8aa0b5;box-shadow:0 2px 0 #24364a}
.buy.max{background:#2a3f55;color:var(--gold);box-shadow:none}
.buy.pl{background:linear-gradient(#e6cdff,#a979f0);color:#2a0f4d;box-shadow:0 2px 0 #6c43ad}
.buy.pl.no{background:#33475c;color:#8aa0b5;box-shadow:0 2px 0 #24364a}
.buy.eq{background:#1f4a35;color:var(--green);box-shadow:none}
.buy.own{background:var(--card2);color:#fff;box-shadow:0 2px 0 #1a2c3e}
.sec{font-size:12px;font-weight:900;color:var(--plume);margin:12px 2px 6px;text-transform:uppercase;letter-spacing:.5px}
.mig{background:linear-gradient(135deg,#3a2a66,#1e3348);border-color:#6c4fc0}
.note{font-size:12.5px;color:var(--mut);margin:2px 2px 8px;line-height:1.35}
.note b{color:#fff}
.stat{display:flex;justify-content:space-between;font-size:13px;padding:5px 2px;border-bottom:1px solid #22384d}
.stat b{color:#fff}
.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
.dex div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 3px;text-align:center;font-size:11px;line-height:1.25}
.dex img{width:52px;height:auto;display:block;margin:0 auto 2px}
.dex .q{font-weight:900;font-size:12px;color:#fff}
.tog{display:flex;justify-content:space-between;align-items:center;padding:4px 2px;font-weight:800;font-size:14px}
.btnw{width:100%;padding:11px;border-radius:10px;background:var(--card2);font-weight:900;margin-top:8px}
.btnw.red{background:#4a1f25;color:#ffb3b3}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#modal.on{display:flex}
#mbox{background:#17293b;border:1px solid #35587a;border-radius:16px;padding:16px;max-width:400px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.6);text-align:center}
#mbox h2{margin:2px 0 8px;font-size:21px}
#mbox p{margin:6px 0;font-size:14px;color:#d5e2ee;line-height:1.4}
#mbox ul{text-align:left;padding-left:4px;list-style:none;margin:8px 0;font-size:14px;line-height:1.4;color:#d5e2ee}
#mbox li{margin:5px 0}
#mbox .big{font-size:20px;font-weight:900}
#mbox .btns{display:flex;gap:8px;margin-top:12px}
#mbox .btns button{flex:1;padding:12px;border-radius:11px;font-weight:900;font-size:15px;background:var(--card2)}
#mbox .btns button.ok{background:linear-gradient(#ffd34d,#f0a500);color:#3a2500}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="goalRow">🦆 <b id="ducksTxt">0</b><span class="g">/ 1 milliard</span><span id="pctTxt"></span></div>
    <div id="goalBar"><div id="goalFill"></div><i style="left:33.33%"></i><i style="left:66.66%"></i></div>
    <div id="chips">
      <div class="chip" id="cashChip">💰 <b id="cashTxt">0</b></div>
      <div class="chip" id="plumeChip">🪶 <b id="plumeTxt">0</b></div>
      <button class="chip" id="dayChip">☀️ Jour 1</button>
      <div class="chip" id="hpChip"><div id="hpFill"></div><span id="hpTxt">❤️ 100</span></div>
    </div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="bossBar"><div id="bossName"><span id="bossN">Boss</span><span id="bossT"></span></div><div id="bossTrack"><div id="bossFill"></div></div></div>
    <div id="banner"><div id="banT"></div><div id="banS"></div></div>
    <div id="hint"></div>
  </div>
  <div id="sellbar">
    <div id="frz"><div id="frzFill"></div><span id="frzTxt">🧊 0 / 20</span></div>
    <button id="sellBtn">VENDRE<small id="sellTxt">+0 💰</small></button>
  </div>
  <nav id="tabs">
    <button data-tab="fusil" class="on">🔫<span>Fusil</span><i class="dot"></i></button>
    <button data-tab="chenil">🐕<span>Chenil</span><i class="dot"></i></button>
    <button data-tab="equipe">🧑‍🌾<span>Équipe</span><i class="dot"></i></button>
    <button data-tab="cabane">🪶<span>Cabane</span><i class="dot"></i></button>
    <button data-tab="infos">⚙️<span>Infos</span><i class="dot"></i></button>
  </nav>
  <div id="panel"></div>
</div>
<div id="modal"><div id="mbox"></div></div>

<script>
'use strict';
// ECO-START
const ECO={
  DAY_LEN:45, BOSS_LEN:30, TRAP_T:12, HUNTER_T:1.0, GROUND_LIFE:30,
  hp:function(d){return 2*Math.pow(1.25,d-1);},
  val:function(d){return Math.pow(1.12,d-1);},
  flock:function(d){return Math.max(1,Math.round(Math.pow(1.23,d-1)));},
  bossHp:function(d){return ECO.hp(d)*(40+12*d);},
  bossPlumes:function(d){return Math.floor(2+0.6*d);},
  migratePlumes:function(md){return md<10?0:Math.floor(Math.pow(md,1.6)/3);},
  enraged:function(d){return d<3?0:Math.min(0.12,0.03+0.002*d);}
};
const UPG={
  dmg:{tab:'fusil',icon:'💥',name:'Dégâts',base:10,grow:1.25,max:1e9,eff:function(L){return (1+0.15*L)*Math.pow(1.1,L);}},
  pellets:{tab:'fusil',icon:'🔵',name:'Plombs',base:50,grow:2.6,max:8,eff:function(L){return 1+0.25*L;}},
  rate:{tab:'fusil',icon:'⏱️',name:'Cadence de tir',base:30,grow:1.8,max:12,eff:function(L){return Math.pow(0.92,L);}},
  appeau:{tab:'fusil',icon:'📯',name:'Appeau',base:60,grow:1.9,max:15,eff:function(L){return 1+0.12*L;}},
  dogs:{tab:'chenil',icon:'🐕',name:'Nouveau chien',base:60,grow:3,max:5,eff:function(L){return 1+L;}},
  dressage:{tab:'chenil',icon:'🦴',name:'Dressage',base:40,grow:1.6,max:25,eff:function(L){return 1+0.12*L;}},
  freezer:{tab:'chenil',icon:'🧊',name:'Congélateur',base:20,grow:1.7,max:20,eff:function(L){return Math.round(20*Math.pow(1.35,L));}},
  hunters:{tab:'equipe',icon:'🧑‍🌾',name:'Chasseur',base:150,grow:3.2,max:6,eff:function(L){return L;}},
  training:{tab:'equipe',icon:'🎯',name:'Entraînement',base:200,grow:1.7,max:1e9,eff:function(L){return Math.pow(1.2,L);}},
  traps:{tab:'equipe',icon:'🕸️',name:'Piège à filet',base:300,grow:3.2,max:6,eff:function(L){return L;}}
};
const TAL={
  power:{icon:'💪',name:'Puissance',base:5,grow:1.45,max:1e9,eff:function(L){return 1+0.25*L;}},
  trade:{icon:'💰',name:'Marchand',base:5,grow:1.45,max:1e9,eff:function(L){return 1+0.25*L;}},
  flockT:{icon:'🦆',name:'Grandes volées',base:8,grow:1.5,max:1e9,eff:function(L){return 1+0.5*L;}},
  luck:{icon:'🍀',name:'Chance',base:10,grow:1.6,max:20,eff:function(L){return 1+0.15*L;}},
  vest:{icon:'🦺',name:'Gilet renforcé',base:6,grow:1.7,max:10,eff:function(L){return 100+20*L;}},
  hourglass:{icon:'⏳',name:'Sablier',base:10,grow:1.8,max:10,eff:function(L){return 2*L;}},
  offline:{icon:'💤',name:'Gains hors ligne',base:10,grow:1.6,max:7,eff:function(L){return 0.25+0.1*L;}},
  autosell:{icon:'🤖',name:'Vente auto',base:12,grow:1,max:1,eff:function(L){return L;}}
};
const WEAPONS=[
  {name:'Vieux fusil',icon:'🔫',dmg:1,pellets:3,spread:24,cd:0.55,cost:0},
  {name:'Fusil à pompe',icon:'💥',dmg:1.6,pellets:5,spread:30,cd:0.5,cost:15},
  {name:'Carabine',icon:'🎯',dmg:9,pellets:1,spread:9,cd:0.26,cost:50},
  {name:'Fusil automatique',icon:'⚙️',dmg:2.2,pellets:4,spread:26,cd:0.14,cost:150},
  {name:'Tromblon géant',icon:'🎺',dmg:4,pellets:12,spread:50,cd:0.6,cost:400},
  {name:'Fusil laser',icon:'⚡',dmg:15,pellets:2,spread:13,cd:0.1,cost:1200},
  {name:'Canon cosmique',icon:'🌌',dmg:30,pellets:10,spread:42,cd:0.28,cost:4000}
];
const BREEDS=[
  {name:'Corniaud',speed:120,carry:2,cost:0,color:'#c9a06a',dark:'#7a5a33'},
  {name:'Beagle',speed:140,carry:3,cost:10,color:'#e0a95e',dark:'#4a2f17',patch:'#f5f0e6'},
  {name:'Labrador',speed:155,carry:4,cost:35,color:'#ead08f',dark:'#b8903f'},
  {name:'Lévrier',speed:230,carry:4,cost:100,color:'#bdb6ab',dark:'#6e665c'},
  {name:'Saint-Bernard',speed:160,carry:10,cost:300,color:'#c0702e',dark:'#5e3210',patch:'#f8f3ea'},
  {name:'Chien-robot',speed:280,carry:12,cost:1000,color:'#a9bccf',dark:'#4a5a6a',robot:true}
];
const RARITY=[
  {name:'Colvert',label:'Commun',w:1000,mult:1,col:'#cfd8dc',pal:{body:'#8d6e4f',belly:'#b0916f',head:'#1e7d3c',collar:'#f5f5f5',beak:'#f4c430',wing:'#6f5238',spec:'#3157d5'}},
  {name:'Sarcelle',label:'Peu commun',w:220,mult:3,col:'#7ee081',pal:{body:'#9e9e9e',belly:'#cfc6b8',head:'#8a3b1f',collar:null,beak:'#3a3a3a',wing:'#7c7c7c',spec:'#1aa36b'}},
  {name:'Mandarin',label:'Rare',w:70,mult:10,col:'#4fc3ff',pal:{body:'#d9822b',belly:'#f3e3c3',head:'#5b2c83',collar:'#ffffff',beak:'#e0322b',wing:'#3b5ba5',spec:'#ff9f1c'}},
  {name:'Canard doré',label:'Épique',w:18,mult:40,col:'#c38bff',pal:{body:'#f2c230',belly:'#ffe58a',head:'#e0a800',collar:'#fff6c2',beak:'#ff8c00',wing:'#d9a400',spec:'#fff2a8',glow:'#ffe066'}},
  {name:'Arc-en-ciel',label:'Légendaire',w:4,mult:200,col:'#ffb74d',rainbow:true,pal:{body:'#ff5c5c',belly:'#ffd34d',head:'#5cc8ff',collar:'#ffffff',beak:'#ffd34d',wing:'#7ee081',spec:'#c38bff',glow:'#ffffff'}},
  {name:'Cosmique',label:'Mythique',w:0.6,mult:1500,col:'#ff5ca8',cosmic:true,pal:{body:'#2b1650',belly:'#43267a',head:'#5a35a8',collar:'#c9b3ff',beak:'#c9b3ff',wing:'#7a4fe0',spec:'#ff8ad8',glow:'#b98cff'}}
];
function derive(S){
  const w=WEAPONS[S.weapon]||WEAPONS[0], b=BREEDS[S.breed]||BREEDS[0], u=S.run.u, t=S.t;
  const dmgMult=UPG.dmg.eff(u.dmg)*TAL.power.eff(t.power);
  return {
    w:w, b:b, dmgMult:dmgMult,
    pelletDmg:w.dmg*dmgMult,
    pellets:Math.max(1,Math.round(w.pellets*UPG.pellets.eff(u.pellets))),
    spread:w.spread*(1+0.03*u.pellets),
    cd:Math.max(0.07,w.cd*UPG.rate.eff(u.rate)),
    spawnRate:UPG.appeau.eff(u.appeau),
    dogs:UPG.dogs.eff(u.dogs), dogSpeed:b.speed*UPG.dressage.eff(u.dressage), carry:b.carry,
    cap:UPG.freezer.eff(u.freezer),
    hunters:u.hunters, hunterDmg:3*dmgMult*UPG.training.eff(u.training),
    traps:u.traps,
    cashMult:TAL.trade.eff(t.trade), flockMult:TAL.flockT.eff(t.flockT), luck:TAL.luck.eff(t.luck),
    maxHp:TAL.vest.eff(t.vest), bossTime:ECO.BOSS_LEN+TAL.hourglass.eff(t.hourglass),
    autosell:t.autosell>0, offEff:TAL.offline.eff(t.offline)
  };
}
function rarityWeights(luck){ return RARITY.map(function(r,i){return i===0?r.w:r.w*luck;}); }
function hpMult(r){ return 1+0.6*Math.log10(RARITY[r].mult); }
function avgRarity(luck){ const ws=rarityWeights(luck); let a=0,b=0; for(let i=0;i<ws.length;i++){a+=ws[i]*RARITY[i].mult;b+=ws[i];} return a/b; }
function avgHpMult(luck){ const ws=rarityWeights(luck); let a=0,b=0; for(let i=0;i<ws.length;i++){a+=ws[i]*hpMult(i);b+=ws[i];} return a/b; }
function upgCost(k,L){ const d=UPG[k]; return d.base*Math.pow(d.grow,L); }
function bulkCost(k,L,n){ const d=UPG[k]; const c0=upgCost(k,L); return d.grow===1?c0*n:c0*(Math.pow(d.grow,n)-1)/(d.grow-1); }
function maxAfford(k,L,cash){ const d=UPG[k]; if(L>=d.max) return 0; const c0=upgCost(k,L); if(cash<c0) return 0; let n=Math.floor(Math.log(cash*(d.grow-1)/c0+1)/Math.log(d.grow)); n=Math.min(Math.max(n,1),d.max-L); while(n>1&&bulkCost(k,L,n)>cash) n--; return n; }
function talCost(k,L){ const d=TAL[k]; return Math.ceil(d.base*Math.pow(d.grow,L)); }
// ECO-END
</script>
<script>
'use strict';
// ===================== OUTILS =====================
const TAU=Math.PI*2;
const $=function(id){return document.getElementById(id);};
const rnd=function(a,b){return a+Math.random()*(b-a);};

}

  while(dogs.length>ST.dogs){ const g=dogs.pop(); if(g.tgt) g.tgt.claim=null; }
  while(hunters.length<ST.hunters) hunters.push({x:0,y:0,cd:rnd(0.2,1),ang:-2.3,fx:0});
  if(hunters.length>ST.hunters) hunters.length=ST.hunters;
  while(traps.length<ST.traps) traps.push({x:0,y:0,t:rnd(0,ECO.TRAP_T),catchT:0,cr:0});
  if(traps.length>ST.traps) traps.length=ST.traps;
  positionEntities();
}
function positionEntities(){
  for(let i=0;i<hunters.length;i++){ hunters[i].x=W-16-i*25*G.u; hunters[i].y=H*0.992; }
  for(let i=0;i<traps.length;i++){ traps[i].x=G.pcx+(i-2.5)*G.prx*0.31; traps[i].y=G.pcy+((i%2)?0.32:-0.28)*G.pry; }
}
function rollRarity(){
  const ws=rarityWeights(ST.luck); let tot=0; for(const x of ws) tot+=x;
  let r=Math.random()*tot; for(let i=0;i<ws.length;i++){ r-=ws[i]; if(r<=0) return i; } return 0;
}
function spawnDuck(){

    const k={en:true,r:r,day:d,x:rnd(W*0.18,W*0.82),y:rnd(H*0.16,H*0.42),z:0,zs:1/clamp(3.4-0.025*d,2.2,3.4),s:12,hp:hpv*1.5,t:rnd(0,9),dir:Math.random()<0.5?1:-1,hitT:0};

  }

function killDuck(k){
  S.st.kills++;
  downs.push({r:k.r,day:k.day,x:clamp(k.x,G.landL,W-14),y:k.y,vy:-60,vx:k.en?0:k.vx*0.15,rot:0,st:'fall',ly:rnd(G.gTop,G.gBot),life:ECO.GROUND_LIFE,claim:null,s:15,dir:(k.en?k.dir:(k.vx>=0?1:-1))});

function inPond(x,y){ const dx=(x-G.pcx)/G.prx, dy=(y-G.pcy)/G.pry; return dx*dx+dy*dy<1; }
function nearestDown(x,y){ let best=null,bd=1e12; for(const o of downs){ if(o.st!=='ground'||o.claim) continue; const dd=dist2(x,y,o.x,o.y); if(dd<bd){bd=dd;best=o;} } return best; }
function moveTo(g,tx,ty,dt,speed){
  const dx=tx-g.x, dy=ty-g.y, d=Math.hypot(dx,dy);
  if(d<5) return true;
  const step=speed*dt; g.moving=true; if(Math.abs(dx)>1) g.dir=dx>0?1:-1;
  if(step>=d){ g.x=tx; g.y=ty; return true; }
  g.x+=dx/d*step; g.y+=dy/d*step; return false;
}

// ===================== TIR =====================
function fire(x,y){
  fireCD=(fireCD>-0.1?fireCD:0)+ST.cd; S.st.shots++; sfx('shot');
  shots.push({x:x,y:y,r:ST.spread,t:0});
  const n=ST.pellets, dmg=ST.pelletDmg, sp=ST.spread;
  for(let p=0;p<n;p++){
    const a=Math.random()*TAU, rr2=sp*Math.sqrt(Math.random());
    const px=x+Math.cos(a)*rr2, py=y+Math.sin(a)*rr2;
    pelletHit(px,py,dmg);
    if(parts.length<300) parts.push({k:'d',x:px,y:py,vx:0,vy:0,life:0.16,max:0.16,s:2.4});
  }
  for(let i=ducks.length-1;i>=0;i--){ if(ducks[i].hp<=0){ const k=ducks[i]; ducks.splice(i,1); killDuck(k); } }
}
function pelletHit(px,py,dmg){
  for(let i=feathers.length-1;i>=0;i--){ const f=feathers[i]; if(dist2(px,py,f.x,f.y)<24*24){ feathers.splice(i,1); puff(f.x,f.y,'#ffffff',5); sfx('pop'); return; } }
  if(boss&&!boss.flee&&boss.hp>0&&dist2(px,py,boss.x,boss.y-boss.r*0.1)<boss.r*boss.r){ boss.hp-=dmg; boss.hitT=0.07; if(Math.random()<0.25) puff(px,py,'#ffffff',1); return; }
  let best=null, bd=1e12;
  for(const k of ducks){
    if(k.hp<=0) continue;
    const dir=k.en?k.dir:(k.vx>=0?1:-1), cx=k.x+dir*k.s*0.15, cy=k.y-k.s*0.1, hr=k.s*1.35;
    const dd=dist2(px,py,cx,cy); if(dd<hr*hr&&dd<bd){ bd=dd; best=k; }
  }
  if(best){ best.hp-=dmg; best.hitT=0.08; if(Math.random()<0.5) puff(px,py,palOf(best.r).body,1); }
}
function tryFire(x,y){ if(phase==='ko'||modalOpen) return; if(fireCD<=0) fire(x,y); else pend={x:x,y:y,t:0.35}; }

// ===================== MISE À JOUR =====================
function update(dt){
  timeT+=dt; S.st.time+=dt;
  phaseT-=dt;
  if(phase==='day'){
    dayAge+=dt;
    spawnT-=dt; if(spawnT<=0){ if(ducks.length<18) spawnDuck(); spawnT=(1/ST.spawnRate)*rnd(0.55,1.45); }
    if(phaseT<=0) startDusk(false);
  } else if(phase==='dusk'){ if(phaseT<=0) startBoss(); }
  else if(phase==='boss'){ if(boss&&!boss.flee&&phaseT<=0){ if(boss.hp<=0) bossDefeated(); else bossFled(); } }
  else if(phase==='dawn'){ if(phaseT<=0) startDay(); }
  else if(phase==='ko'){ if(phaseT<=0){ hp=ST.maxHp; startDay(); } }
  const target=(phase==='dusk'||phase==='boss')?1:0;
  nightK+=(target-nightK)*Math.min(1,dt*1.4);
  // tir
  fireCD-=dt;
  if(pend){ pend.t-=dt; if(pend.t<=0) pend=null; else if(fireCD<=0){ const p=pend; pend=null; fire(p.x,p.y); } }
  if(holding&&fireCD<=0&&phase!=='ko') fire(aimX,aimY);
  // canards en vol
  for(let i=ducks.length-1;i>=0;i--){
    const k=ducks[i]; k.t+=dt; if(k.hitT>0) k.hitT-=dt;
    if(k.en){
      k.z+=k.zs*dt; k.s=12+k.z*30; k.x+=Math.sin(k.t*3)*12*dt;
      if(k.z>=1){ ducks.splice(i,1); hurt(15); if(phase==='ko') break; continue; }
    } else {
      if(phase!=='day') k.vx*=1+dt*1.6;
      k.x+=k.vx*dt; k.y=k.by+Math.sin(k.t*k.fq+k.ph)*k.amp;
      if((k.vx>0&&k.x>W+50)||(k.vx<0&&k.x<-50)){ ducks.splice(i,1); continue; }
      if(k.r>=3&&Math.random()<dt*8) parts.push({k:'sp',x:k.x+rnd(-12,12),y:k.y+rnd(-10,10),vx:0,vy:rnd(-20,-5),life:0.5,max:0.5,s:2,c:RARITY[k.r].col});
    }
  }
  // canards tombés
  for(let i=downs.length-1;i>=0;i--){
    const o=downs[i];
    if(o.st==='fall'){
      o.vy+=520*dt; o.y+=o.vy*dt; o.x=clamp(o.x+o.vx*dt,G.landL,W-14); o.rot+=7*dt;
      if(o.y>=o.ly){ o.y=o.ly; o.st='ground'; o.pond=inPond(o.x,o.y); if(o.pond) splash(o.x,o.y); }
    } else {
      o.life-=dt; if(o.life<=0){ if(o.claim) o.claim.tgt=null; downs.splice(i,1); }
    }
  }
  updateDogs(dt); updateHunters(dt); updateTraps(dt); updateBoss(dt); updateFeathers(dt);
  // effets
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.life-=dt; if(p.life<=0){ parts.splice(i,1); continue; }
    if(p.k==='f'){ p.vy+=70*dt; p.vx*=0.97; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt; }
    else if(p.k==='s'||p.k==='coin'){ p.vy+=520*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }
    else if(p.k==='c'){ p.vy+=260*dt; p.vx*=0.98; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt; }
    else if(p.k==='sp'){ p.y+=p.vy*dt; }
  }
  for(let i=floats.length-1;i>=0;i--){ const f=floats[i]; f.life-=dt; f.y-=30*dt; if(f.life<=0) floats.splice(i,1); }
  for(let i=tracers.length-1;i>=0;i--){ tracers[i].t-=dt; if(tracers[i].t<=0) tracers.splice(i,1); }
  for(let i=shots.length-1;i>=0;i--){ shots[i].t+=dt; if(shots[i].t>0.14) shots.splice(i,1); }
  // vente auto
  if(ST.autosell){ autoT+=dt; if(S.run.frzN>=ST.cap||(autoT>3&&S.run.frzN>0)){ autoT=0; sell(true); } }
  // vie
  hurtT+=dt; if(hurtT>3&&hp<ST.maxHp&&phase!=='ko') hp=Math.min(ST.maxHp,hp+6*dt);
  if(hp>ST.maxHp) hp=ST.maxHp;
  if(shake>0) shake=Math.max(0,shake-dt*30); if(flashT>0) flashT-=dt;
}
function updateDogs(dt){
  for(let i=0;i<dogs.length;i++){
    const g=dogs[i]; g.t+=dt; g.moving=false;
    const hx=G.homeX+(i%3)*10*G.u, hy=G.homeY-Math.floor(i/3)*7*G.u;
    if(g.st==='idle'){ const o=nearestDown(g.x,g.y); if(o){ o.claim=g; g.tgt=o; g.st='go'; } else moveTo(g,hx,hy,dt,ST.dogSpeed*0.5); }
    if(g.st==='go'){
      const o=g.tgt;
      if(!o||downs.indexOf(o)<0){
        const nx=g.carry.length<ST.carry?nearestDown(g.x,g.y):null;
        if(nx){ nx.claim=g; g.tgt=nx; } else { g.tgt=null; g.st=g.carry.length?'back':'idle'; }
      } else if(moveTo(g,o.x,o.y,dt,ST.dogSpeed)){
        downs.splice(downs.indexOf(o),1); g.carry.push({r:o.r,day:o.day}); g.tgt=null;
        const nx=g.carry.length<ST.carry?nearestDown(g.x,g.y):null;
        if(nx){ nx.claim=g; g.tgt=nx; } else g.st='back';
      }
    }
    if(g.st==='back'){
      if(moveTo(g,hx,hy,dt,ST.dogSpeed)){
        while(g.carry.length&&S.run.frzN<ST.cap) deposit(g.carry.pop(),G.frzX+G.frzW/2,G.frzY-14);
        if(g.carry.length){ g.full=true; } else { g.full=false; g.st='idle'; }
      }
    }
  }
}
function updateHunters(dt){
  for(const h of hunters){
    h.cd-=dt; if(h.fx>0) h.fx-=dt;
    if(h.cd>0) continue;
    let tg=null;
    if(boss&&!boss.flee&&boss.in&&boss.hp>0) tg=boss;
    else {
      let bz=-1; for(const k of ducks){ if(k.en&&k.hp>0&&k.z>bz){ bz=k.z; tg=k; } }
      if(!tg){ const vis=ducks.filter(function(k){return k.hp>0&&k.x>12&&k.x<W-12;}); if(vis.length) tg=vis[(Math.random()*vis.length)|0]; }
    }
    if(!tg){ h.cd=0.25; continue; }
    h.cd=ECO.HUNTER_T*rnd(0.85,1.15);
    const gy=h.y-22*G.u; h.ang=Math.atan2(tg.y-gy,tg.x-h.x); h.fx=0.09;
    tracers.push({x1:h.x+Math.cos(h.ang)*22*G.u,y1:gy+Math.sin(h.ang)*22*G.u,x2:tg.x,y2:tg.y,t:0.08});
    tg.hp-=ST.hunterDmg; tg.hitT=0.08; sfx('hshot');
    if(tg!==boss&&tg.hp<=0){ const idx=ducks.indexOf(tg); if(idx>=0){ ducks.splice(idx,1); killDuck(tg); } }
  }
}
function updateTraps(dt){
  for(const tp of traps){
    tp.t+=dt; if(tp.catchT>0) tp.catchT-=dt;
    if(tp.t>=ECO.TRAP_T){
      tp.t=0; const r=rollRarity(); tp.cr=r; tp.catchT=1.2;
      if(S.run.frzN<ST.cap) deposit({r:r,day:S.run.day},tp.x,tp.y-16); else floatTxt(tp.x,tp.y-16,'Plein !','#ff8a80');
    }
  }
}
function updateBoss(dt){
  if(!boss) return;
  boss.t+=dt; if(boss.hitT>0) boss.hitT-=dt;
  if(boss.flee){ boss.y-=280*dt; if(boss.y<-boss.r*2) boss=null; return; }
  const span=Math.max(10,W/2-boss.r-10);
  const tx=W/2+Math.sin(boss.t*0.6)*span, ty=H*0.27+Math.sin(boss.t*1.25)*H*0.07;
  if(!boss.in){ const k=Math.min(1,dt*3); boss.x+=(tx-boss.x)*k; boss.y+=(ty-boss.y)*k; if(Math.abs(boss.y-ty)<5) boss.in=true; }
  else { boss.x=tx; boss.y=ty; }
  boss.dir=Math.cos(boss.t*0.6)>=0?1:-1;
  if(boss.in){
    boss.atk-=dt;
    if(boss.atk<=0){ const d=S.run.day, n=1+Math.min(3,Math.floor(d/12)); for(let i=0;i<n;i++) spawnFeather(); boss.atk=Math.max(1.1,2.4-0.02*d)*rnd(0.85,1.15); }
  }
  if(boss.hp<=0) bossDefeated();
}
function spawnFeather(){
  const d=S.run.day, tx=rnd(28,W-28), ty=H-10, T=Math.max(1.5,2.6-0.012*d);
  feathers.push({x:boss.x,y:boss.y+boss.r*0.3,y0:boss.y+boss.r*0.3,vx:(tx-boss.x)/T,vy:(ty-boss.y-boss.r*0.3)/T,rot:rnd(0,TAU),vr:rnd(-6,6),tx:tx,ty:ty});
}
function updateFeathers(dt){
  for(let i=feathers.length-1;i>=0;i--){
    const f=feathers[i]; f.x+=f.vx*dt; f.y+=f.vy*dt; f.rot+=f.vr*dt;
    if(f.y>=f.ty){ feathers.splice(i,1); hurt(12); if(phase==='ko') return; }
  }
}

function drawSky(c){

function drawBoss(c){

function offlineGains(sec){
  if(!(sec>60)) return;
  sec=Math.min(sec,8*3600);
  const d=S.run.day, avg=avgRarity(ST.luck), H1=ECO.hp(d)*avgHpMult(ST.luck);
  const hk=ST.hunters*Math.min(1,ST.hunterDmg/H1)/ECO.HUNTER_T;
  const kills=Math.min(ST.spawnRate*0.8,hk);
  const retr=ST.dogs*ST.carry/(2*(W*0.5||180)/ST.dogSpeed+0.5);
  const caught=(Math.min(kills,retr)+ST.traps/ECO.TRAP_T)*sec*ST.offEff;
  if(caught<1){ if(sec>600) showModal('<h2>😴 Bon retour !</h2><p>Achète des <b>chasseurs</b> et des <b>pièges</b> (onglet Équipe) pour gagner des canards même quand tu n\'es pas là.</p>',[{t:'OK',ok:true}]); return; }
  const nd=caught*ECO.flock(d)*avg*ST.flockMult, cash=caught*ECO.val(d)*avg*ST.cashMult;
  S.ducks+=nd; S.run.cash+=cash; checkMiles(); save();
  showModal('<h2>😴 Bon retour !</h2><p>Tu étais absent <b>'+fmtTime(sec)+'</b>.<br>Ton équipe a continué la chasse :</p><p class="big">+'+fmt(nd)+' 🦆<br><span style="color:var(--gold)">+'+fmt(cash)+' 💰</span></p>',[{t:'Super !',ok:true}]);
}

function cloudInit(){
  if(!window.claude||typeof window.claude.use!=='function') return;
  let db=null, user=null;
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    db=r[0]; user=r[1]; if(!db||!user) return null;
    return user.id();
  }).then(function(uid){
    if(!uid) return null;
    const ref=db.doc('data/users/'+uid+'/save');
    return Promise.race([ref.get(),new Promise(function(_,rej){ setTimeout(function(){ rej({code:'timeout'}); },10000); })]).then(function(snap){
      cloud.ref=ref; cloud.ok=true;
      let o=null;
      if(snap&&snap.exists){ try{ const d=snap.data(); o=JSON.parse(d&&d.save); }catch(e){ o=null; } }
      if(o&&typeof o==='object'&&o.st){
        const ct=Number(o.st.time)||0, lt=Number(S.st.time)||0;
        if(!hadLocal||ct>lt+5){ adoptSave(o); return; }
      }
      cloudSave(true);
    });
  }).catch(function(){ cloud.ok=false; });
}
function adoptSave(o){
  S=sanitize(merge(freshState(),o)); recalc();
  ducks.length=0; downs.length=0; feathers.length=0; dogs.length=0; hunters.length=0; traps.length=0; parts.length=0; floats.length=0;
  boss=null; $('bossBar').classList.remove('on');
  syncEntities(); hp=ST.maxHp; nightK=0; banQ.length=0; startDay(); buildPanel(); updateHUD();
  try{ localStorage.setItem(SAVE_KEY,JSON.stringify(S)); }catch(e){}
  cloud.sig=saveSig();
  if(welcomeOpen&&S.seen){ welcomeOpen=false; $('modal').classList.remove('on'); modalOpen=false; nextModal(); }
  showBanner('☁️ Partie récupérée !','Jour '+S.run.day+' · '+fmt(S.ducks)+' 🦆','#9fe3ff');
  offlineGains((Date.now()-S.last)/1000); S.last=Date.now();
}

const PTRS=new Map();
function releaseAll(){ holding=false; activeId=null; PTRS.clear(); }
function ptr(e){ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
cv.addEventListener('pointerdown',function(e){
  e.preventDefault(); audioInit(); if(modalOpen) return;
  const p=ptr(e); PTRS.set(e.pointerId,p);
  if(activeId===null){ activeId=e.pointerId; holding=true; aimX=p.x; aimY=p.y; }
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  tryFire(p.x,p.y);
});
cv.addEventListener('pointermove',function(e){ if(!PTRS.has(e.pointerId)) return; const p=ptr(e); PTRS.set(e.pointerId,p); if(e.pointerId===activeId){ aimX=p.x; aimY=p.y; } });
function ptrUp(e){ PTRS.delete(e.pointerId); if(e.pointerId===activeId){ const nx=PTRS.keys().next(); if(!nx.done){ activeId=nx.value; const q=PTRS.get(activeId); aimX=q.x; aimY=q.y; } else { holding=false; activeId=null; } } }
cv.addEventListener('pointerup',ptrUp); cv.addEventListener('pointercancel',ptrUp); cv.addEventListener('lostpointercapture',ptrUp);
cv.addEventListener('contextmenu',function(e){ e.preventDefault(); });
$('sellBtn').addEventListener('click',function(){ audioInit(); sell(false); });
$('dayChip').addEventListener('click',function(){ audioInit(); if(phase==='day'&&dayAge>2&&phaseT>3){ S.skipUsed=true; startDusk(true); } });
document.querySelectorAll('#tabs button').forEach(function(b){ b.addEventListener('click',function(){ audioInit(); curTab=b.dataset.tab; document.querySelectorAll('#tabs button').forEach(function(x){ x.classList.toggle('on',x===b); }); buildPanel(); $('panel').scrollTop=0; }); });
document.addEventListener('visibilitychange',function(){
  if(document.hidden){ save(true); releaseAll(); }
  else { const el=(Date.now()-S.last)/1000; lastT=performance.now(); offlineGains(el); S.last=Date.now(); }
});
window.addEventListener('pagehide',function(){ save(true); });
window.addEventListener('resize',resize);
if(window.ResizeObserver){ new ResizeObserver(function(){ resize(); }).observe($('stage')); }

// ===================== BOUCLE =====================
let lastT=performance.now(), uiT=0, cardT=0, saveT=0;
function frame(now){
  let dt=(now-lastT)/1000; lastT=now; if(!(dt>0)) dt=0; if(dt>0.1) dt=0.1;
  if(banT>0){ banT-=dt; if(banT<=0) nextBanner(); }
  try{ if(!modalOpen) update(dt); render(); }catch(err){ if(window.console) console.error(err); }
  uiT+=dt; if(uiT>0.1){ uiT=0; updateHUD(); }
  cardT+=dt; if(cardT>0.25){ cardT=0; refreshCards(); }
  saveT+=dt; if(saveT>5){ saveT=0; save(); }
  requestAnimationFrame(frame);
}
initSky(); resize(); syncEntities(); hp=ST.maxHp; buildPanel(); startDay(); updateHUD();
if(!S.seen) showHelp(true); else offlineGains((Date.now()-S.last)/1000);
S.last=Date.now();
requestAnimationFrame(frame);
cloudInit();
</script>
</body>
</html>
