function audioInit(){if(SND.ctx)return;try{const C=new (window.AudioContext||window.webkitAudioContext)();SND.ctx=C;const o=C.createOscillator(),f=C.createBiquadFilter(),g=C.createGain();o.type='sawtooth';o.frequency.value=60;f.type='lowpass';f.frequency.value=500;g.gain.value=0;o.connect(f);f.connect(g);g.connect(C.destination);o.start();SND.eng={o,g,f};}catch(e){}}
function engine(vol,freq){if(!SND.eng)return;const t=SND.ctx.currentTime;SND.eng.g.gain.setTargetAtTime(SND.on?vol:0,t,.1);SND.eng.o.frequency.setTargetAtTime(freq,t,.1);}
function sfx(type){const C=SND.ctx;if(!C||!SND.on)return;const t=C.currentTime;const g=C.createGain();g.connect(C.destination);
 const tone=(f,d,tp,v,f2)=>{const o=C.createOscillator();o.type=tp||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);const gg=C.createGain();gg.gain.setValueAtTime(v||.2,t);gg.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gg);gg.connect(C.destination);o.start(t);o.stop(t+d);};
 const noise=(d,v,fq)=>{const b=C.createBuffer(1,C.sampleRate*d,C.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/a.length,2);const s=C.createBufferSource();s.buffer=b;const f=C.createBiquadFilter();f.type='bandpass';f.frequency.value=fq||1200;const gg=C.createGain();gg.gain.value=v||.4;s.connect(f);f.connect(gg);gg.connect(C.destination);s.start(t);};
 if(type==='coin'){tone(988,.12,'square',.08);setTimeout(()=>tone(1319,.25,'square',.08),90);}
 else if(type==='jump')tone(300,.18,'sine',.15,600);

 const a=Math.min(1,Math.hypot(jx,jy));let [mx,mz]=camMove(jx,jy);
 if(P.state==='walk'||P.state==='swim'){
  const swim=P.state==='swim';const sp=swim?4.6:(a>.85?8.5:6.2*a/.85);
  const tx=mx*sp,tz=mz*sp;const k=Math.min(1,dt*(P.ground||swim?10:2.5));P.vx=lerp(P.vx,tx,k);P.vz=lerp(P.vz,tz,k);

  P.x+=P.vx*dt;P.z+=P.vz*dt;
  const p={x:P.x,z:P.z};collide(p,.42,P.y+.3);P.x=p.x;P.z=p.z;

  }else{

   if(P.ground&&g>P.y-.6)P.y=g;

 else if(P.state==='fall'||P.state==='chute'){

  else{P.vy=lerp(P.vy,-6.5,dt*2.5);const fx=Math.sin(P.yaw),fz=Math.cos(P.yaw);P.vx=lerp(P.vx,mx*7+fx*2.5,dt*1.5);P.vz=lerp(P.vz,mz*7+fz*2.5,dt*1.5);}
  if(a>.1)P.yaw+=angDiff(P.yaw,Math.atan2(mx,mz))*Math.min(1,dt*3);
  P.x+=P.vx*dt;P.z+=P.vz*dt;P.y+=P.vy*dt;
  CHUTE.position.set(P.x,P.y,P.z);CHUTE.rotation.y=P.yaw;

  if(P.y<=surf+.05){CHUTE.visible=false;if(!ch)toast('Aïe ! Atterrissage brutal',1500);P.y=g;P.vy=0;P.state=(WORLD==='ile'&&g<-1.1)?'swim':'walk';P.vx*=.2;P.vz*=.2;}

const _fx=new THREE.Vector3();
function updateVehicle(v,dt){
 const drv=v.driver===PL;let [jx,jy]=drv?readKeys():[0,0];
 if(v.dead>0){v.dead-=dt;if(v.dead<=0){Object.assign(v,{x:v.home.x,z:v.home.z,yaw:v.home.yaw,speed:0,pitch:0,roll:0,vy:0,thr:0,air:false,y:v.kind==='plane'?2.2:groundAt(v.home.x,v.home.z)});v.g.visible=true;}else return;}
 if(v.kind==='plane')return updatePlane(v,dt,jx,jy,drv);
 if(!drv&&Math.abs(v.speed)<.05&&!v.air){return;}
 const water=v.kind==='jetski';
 const tgt=jy>0?v.max*jy:jy<0?-v.max*.35*(-jy):0;
 const acc=(jy*v.speed<0?v.acc*2:v.acc);
 if(Math.abs(jy)>.05)v.speed+=clamp(tgt-v.speed,-acc*dt,acc*dt);else v.speed*=Math.pow(water?.55:.35,dt);
 if(!v.air||water)v.yaw-=jx*v.turn*dt*clamp(v.speed/7,-1,1);
 const fx=Math.sin(v.yaw),fz=Math.cos(v.yaw);const ox=v.x,oz=v.z;
 v.x+=fx*v.speed*dt;v.z+=fz*v.speed*dt;
 const h=groundAt(v.x,v.z);
 if(water){if(H(v.x,v.z)>-.55){v.x=ox;v.z=oz;v.speed*=-.3;}
  const wy=waveH(v.x,v.z,TIME)-.1;if(v.air){v.vy-=20*dt;v.y+=v.vy*dt;if(v.y<=wy){v.y=wy;v.air=false;v.vy=0;}}else{v.y=wy;if(drv&&IN.jumpPressed&&v.speed>6){v.vy=6.5;v.air=true;sfx('jump');}}
  v.pitch=lerp(v.pitch,v.air?.15:clamp(v.speed*.006,0,.12)+Math.sin(TIME*3)*.02,dt*5);v.roll=lerp(v.roll,-jx*.35*clamp(v.speed/10,0,1),dt*5);}
 else{
  if(h<-.7){v.x=ox;v.z=oz;v.speed*=-.25;toast('Pas dans l\'eau ! 🌊',900);}
  const p={x:v.x,z:v.z};if(collide(p,v.rad,v.y+.8)){v.speed*=.5;}v.x=p.x;v.z=p.z;
  const g=groundAt(v.x,v.z);
  if(v.air){v.vy-=24*dt;v.y+=v.vy*dt;if(v.y<=g){v.y=g;v.air=false;if(v.vy<-8)sfx('thud');v.vy=0;}}
  else{const dy=g-v.y;if(dy<-.6&&Math.abs(v.speed)>8){v.air=true;v.vy=Math.max(0,v.lastVy||0);}else v.y=g;
   if(drv&&IN.jumpPressed){v.vy=6;v.air=true;sfx('jump');}}
  v.lastVy=(g-(v.lastG===undefined?g:v.lastG))/Math.max(dt,1e-3);v.lastG=g;
  const L=1.2;const hf=groundAt(v.x+fx*L,v.z+fz*L),hb=groundAt(v.x-fx*L,v.z-fz*L);const rx=Math.cos(v.yaw),rz=-Math.sin(v.yaw);const hl=groundAt(v.x+rx,v.z+rz),hr=groundAt(v.x-rx,v.z-rz);
  const tp=v.air?v.pitch:Math.atan2(hf-hb,2*L);const tr=v.air?v.roll:Math.atan2(hl-hr,2)*.8+(v.kind==='scooter'?-jx*.45*clamp(v.speed/10,0,1):0);
  v.pitch=lerp(v.pitch,tp,dt*8);v.roll=lerp(v.roll,tr,dt*8);
  for(const w of v.W)w.children.forEach(c=>c.rotation.x+=v.speed*dt/.45);
  if(v.kind==='buggy'){v.W[0].rotation.y=v.W[1].rotation.y=-jx*.45;}}
 syncVeh(v);
 if(drv){engine(.05+Math.abs(v.speed)/v.max*.06,50+Math.abs(v.speed)*6);}
}
function crash(v){sfx('boom');boom(v.x,v.y,v.z);v.g.visible=false;v.dead=3;v.speed=0;
 if(v.driver===PL){v.driver=null;v.g.remove(PL.P.g);scene.add(PL.P.g);PL.veh=null;CAM.dist=7.5;PL.state='walk';PL.x=PIER.x;PL.z=PIER.z0+4;PL.y=groundAt(PL.x,PL.z);PL.vy=0;toast('💥 Crash ! Retour au port',2200);engine(0,60);}}
function updatePlane(v,dt,jx,jy,drv){
 if(!drv&&!v.air&&v.speed<.1&&v.thr===0)return;
 if(drv){if(IN.up||keys.ShiftLeft||keys.ShiftRight)v.thr=Math.min(1,v.thr+dt*.6);if(IN.down||keys.ControlLeft||keys.KeyC)v.thr=Math.max(0,v.thr-dt*.8);}
 else v.thr=Math.max(0,v.thr-dt*(v.air?.08:1));
 const surf=Math.max(H(v.x,v.z),waveH(v.x,v.z,TIME)-.1);const water=H(v.x,v.z)<-.3;
 const thrust=v.thr*14.5,drag=.0045*v.speed*v.speed+(v.air?0:(water?.6:3));
 v.speed+=(thrust-drag-(v.air?15*Math.sin(v.pitch):0))*dt;v.speed=clamp(v.speed,0,72);
 if(v.air){
  v.roll=lerp(v.roll,jx*.95,dt*2.2);
  v.pitch+=(jy*.9)*dt;if(Math.abs(jy)<.1)v.pitch=lerp(v.pitch,drv?0:-.12,dt*.6);
  if(v.speed<21){v.pitch-=(21-v.speed)*.035*dt;}
  v.pitch=clamp(v.pitch,-1.1,1.1);
  v.yaw-=Math.sin(v.roll)*1.05*dt*clamp(v.speed/25,0,1.4);
  const sink=v.speed<21?(21-v.speed)*.35:0;
  v.vy=Math.sin(v.pitch)*v.speed-sink;
  v.x+=Math.sin(v.yaw)*Math.cos(v.pitch)*v.speed*dt;v.z+=Math.cos(v.yaw)*Math.cos(v.pitch)*v.speed*dt;v.y+=v.vy*dt;
  if(v.y>420){v.y=420;v.pitch=Math.min(v.pitch,0);}
  if(v.y-2.05<=surf){
   if(v.vy<-10||Math.abs(v.roll)>.55||v.pitch<-.35||(!water&&v.speed>45))return crash(v);
   v.air=false;v.y=surf+2.05;v.pitch=0;v.vy=0;}
  // collision décor (phare, hôtel…)
  const p={x:v.x,z:v.z};if(collide(p,2.5,v.y-1.5))return crash(v);
 }else{
  v.roll=lerp(v.roll,0,dt*4);v.yaw-=jx*.9*dt*clamp(v.speed/5,0,1);
  v.pitch=lerp(v.pitch,(v.speed>20&&jy>.3)?.25:0,dt*3);
  v.x+=Math.sin(v.yaw)*v.speed*dt;v.z+=Math.cos(v.yaw)*v.speed*dt;
  const p={x:v.x,z:v.z};if(collide(p,2.5,surf+.5)){v.speed*=.3;}v.x=p.x;v.z=p.z;
  const s2=Math.max(H(v.x,v.z),waveH(v.x,v.z,TIME)-.1);v.y=lerp(v.y,s2+2.05,Math.min(1,dt*8));
  if(v.speed>22&&v.pitch>.15){v.air=true;v.pitch=.2;toast('✈️ Décollage !',1000);}
  if(!water&&H(v.x,v.z)>1&&v.speed>3){v.speed*=Math.pow(.4,dt);}
 }
 if(Math.abs(v.x)>1200||Math.abs(v.z)>1200){v.yaw+=Math.PI*dt;}
 v.prop.rotation.z+=(v.thr*40+v.speed*.3)*dt;
 syncVeh(v);
 if(drv)engine(.04+v.thr*.08,70+v.thr*90+v.speed*1.2);
}
// explosion
const BOOMS=[];

 if(P.state==='drive'){const v=P.veh;tx=v.x;tz=v.z;ty=v.y+(v.kind==='plane'?2.5:1.6);fy=v.yaw+Math.PI;
  if(IN.dragT<=0&&(Math.abs(v.speed)>2||v.kind==='plane')){CAM.yaw+=angDiff(CAM.yaw,fy)*Math.min(1,dt*(v.kind==='plane'?3.5:2.2));

 const dist=P.state==='chute'?12:CAM.dist;
 _ct.set(tx,ty,tz);
 _cp.set(tx+Math.sin(CAM.yaw)*Math.cos(CAM.pitch)*dist,ty+Math.sin(CAM.pitch)*dist,tz+Math.cos(CAM.yaw)*Math.cos(CAM.pitch)*dist);
 if(WORLD==='ile'){const g=Math.max(groundAt(_cp.x,_cp.z),waveH(_cp.x,_cp.z,TIME))+.6;if(_cp.y<g)_cp.y=g;}

 AR.bow.position.copy(MG.cam.position);AR.bow.quaternion.copy(MG.cam.quaternion);AR.bow.scale.setScalar(.26);AR.bow.translateX(.33);AR.bow.translateY(-.22);AR.bow.translateZ(-.9);
 const f=AR.fly;if(f){const N=6,h=dt/N;for(let s=0;s<N&&AR.fly;s++){const oz=f.p.z;f.v.y-=6*h;f.v.x+=AR.wind*h;f.p.addScaledVector(f.v,h);
   const T=AR.T.position,fz=T.z+.21;if(oz>fz&&f.p.z<=fz){const r=Math.hypot(f.p.x-T.x,f.p.y-T.y);if(r<1){const pts=Math.max(1,10-Math.floor(r/.1));AR.score+=pts;f.p.z=fz+.05;arHit(pts);return;}}
   if(f.p.y<0||f.p.z<-150){arHit(0);return;}}
  f.m.position.copy(f.p);f.m.lookAt(f.p.clone().sub(f.v));}}
function arHit(pts){const f=AR.fly;f.m.position.copy(f.p);f.m.lookAt(f.p.clone().sub(f.v));AR.stuck.push(f.m);AR.fly=null;sfx(pts?'thud':'bounce');
 mgMsg(pts?(pts===10?'🎯 10 ! En plein centre !':pts+' points'):'Raté !',1100);AR.n++;
 if(AR.n>=4){AR.n=0;AR.round++;if(AR.round>=3){AR.over=true;const b=best('archery',AR.score);setTimeout(()=>mgEnd('Tir à l\'arc terminé !','Score : <b>'+AR.score+'</b> / 120<br>Record : '+b),1200);arInfo();return;}setTimeout(arRound,1300);}
 else{AR.wind=rr(-2.2,2.2);}arInfo();}
function mgUpdate(dt){if(MG.kind==='bowling')bowlUpdate(dt);else if(MG.kind==='basket')bkUpdate(dt);else if(MG.kind==='archery')arUpdate(dt);}
/* ================= CARTE / MINI-CARTE ================= */
const MAPIMG=(()=>{const N=300,c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d'),im=x.createImageData(N,N);
 for(let j=0;j<N;j++)for(let i=0;i<N;i++){const wx=(i/N-.5)*760,wz=(j/N-.5)*760,h=H(wx,wz),k=(j*N+i)*4;let r,g,b;
  if(h<-.3){const d=smooth(-.3,-12,h);r=lerp(120,30,d);g=lerp(215,140,d);b=lerp(220,200,d);}else if(h<2.4){r=240;g=222;b=160;}
  else if(Math.hypot(wx-V.x,wz-V.z)<110&&h>20){const t=smooth(20,90,h);r=lerp(140,70,t);g=lerp(120,55,t);b=lerp(100,50,t);}else{const t=smooth(2,50,h);r=lerp(120,70,t);g=lerp(200,150,t);b=lerp(80,60,t);}
  if(pathDist(wx,wz)<2.6&&h>0){r=215;g=185;b=125;}
  if(Math.hypot(wx-V.x,wz-V.z)<16){r=255;g=110;b=30;}
  im.data[k]=r;im.data[k+1]=g;im.data[k+2]=b;im.data[k+3]=255;}
 x.putImageData(im,0,0);return c;})();
const POI=[{n:'🏘️ Ville',x:TOWN.x,z:TOWN.z+14},{n:'🎳 Bowling',x:BOWL.x,z:BOWL.z+14},{n:'⚓ Port',x:PIER.x,z:PIER.z0+3},{n:'🏨 Hôtel',x:HOTEL.x+Math.sin(Math.atan2(HOTEL.x,HOTEL.z))*12,z:HOTEL.z+Math.cos(Math.atan2(HOTEL.x,HOTEL.z))*12},
 {n:'🏀 Basket',x:COURT.x,z:COURT.z-13},{n:'🏹 Tir à l\'arc',x:Frame(RANGE.x,0,RANGE.z,Math.PI/2).w(0,15).x,z:Frame(RANGE.x,0,RANGE.z,Math.PI/2).w(0,15).z},{n:'🌋 Grotte',x:Frame(CAVE.x,0,CAVE.z,CAVE.ang).w(0,8).x,z:Frame(CAVE.x,0,CAVE.z,CAVE.ang).w(0,8).z},
 {n:'⛰️ Sommet',x:RIM.x,z:RIM.z},{n:'🗼 Phare',x:LH.x-6,z:LH.z-6}];
const toMap=(x,z,S)=>[(x/760+.5)*S,(z/760+.5)*S];
function drawMap(cv,S,zoom,cx,cz){const x=cv.getContext('2d');x.save();x.clearRect(0,0,S,S);
 if(zoom){x.beginPath();x.arc(S/2,S/2,S/2,0,7);x.clip();x.fillStyle='#2aa7d8';x.fillRect(0,0,S,S);const sc=S/zoom;x.translate(S/2,S/2);x.scale(sc*760/300,sc*760/300);x.translate(-(cx/760+.5)*300,-(cz/760+.5)*300);x.drawImage(MAPIMG,0,0);x.restore();x.save();}
 else x.drawImage(MAPIMG,0,0,S,S);
 const P=zoom?(wx,wz)=>[S/2+(wx-cx)*S/zoom,S/2+(wz-cz)*S/zoom]:(wx,wz)=>toMap(wx,wz,S);
 x.font=(zoom?14:20)+'px sans-serif';x.textAlign='center';x.textBaseline='middle';
 for(const p of POI){const [a,b]=P(p.x,p.z);x.fillText(p.n.split(' ')[0],a,b);}
 x.fillStyle='#ffd23f';for(const s of SHELLS){if(s.taken||s.where!=='ile')continue;const [a,b]=P(s.x,s.z);x.beginPath();x.arc(a,b,zoom?3:5,0,7);x.fill();x.strokeStyle='#7a4a00';x.stroke();}
 for(const v of VEH){if(v.kind!=='plane'||v.dead>0)continue;const [a,b]=P(v.x,v.z);x.fillText('🛩️',a,b);}
 let px=PL.x,pz=PL.z,py=PL.yaw;if(WORLD!=='ile'){px=CAVE.x;pz=CAVE.z;}if(PL.veh){px=PL.veh.x;pz=PL.veh.z;py=PL.veh.yaw;}
 const [a,b]=P(px,pz);x.translate(a,b);x.rotate(-py+Math.PI);x.fillStyle='#e63946';x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.moveTo(0,-9);x.lineTo(6,7);x.lineTo(0,3);x.lineTo(-6,7);x.closePath();x.fill();x.stroke();x.restore();}
function toggleMap(){const m=$('map');if(m.style.display==='flex'){m.style.display='none';return;}if(MG.on)return;m.style.display='flex';drawMap($('bigmap'),600);
 $('ftList').innerHTML='';if(WORLD!=='ile'||PL.state!=='walk'&&PL.state!=='swim'){$('ftList').innerHTML='<span class="pill">Voyage rapide : à pied, sur l\'île</span>';return;}
 POI.forEach(p=>{const b=document.createElement('button');b.className='btn g';b.textContent=p.n;b.onclick=()=>{m.style.display='none';fadeTo(()=>{moveWorld('ile',p.x,groundAt(p.x,p.z),p.z,Math.atan2(TOWN.x-p.x,TOWN.z-p.z)||0);});};$('ftList').appendChild(b);});}
$('bTime').onclick=()=>{const n=[.18,.48,.7,.94];let i=n.findIndex(v=>v>CYC.ph+.01);if(i<0)i=0;CYC.ph=n[i];applyCycle();toast(['☀️ Journée','🌅 Coucher de soleil','🌙 Nuit néon','🌄 Aube'][i],1200);};
$('bMap').onclick=toggleMap;$('mapClose').onclick=toggleMap;$('mini').onclick=toggleMap;
$('bSnd').onclick=()=>{SND.on=!SND.on;$('bSnd').textContent=SND.on?'🔊 Son':'🔇 Son';if(!SND.on)engine(0,60);};

/* ================= COQUILLAGES ================= */
let GOT=[];try{GOT=JSON.parse(localStorage.getItem('nova_shells')||'[]');}catch(e){}
SHELLS.forEach(s=>{if(GOT.includes(s.id)){s.taken=true;s.g.visible=false;}});
function shellHUD(){$('shells').textContent='🐚 '+SHELLS.filter(s=>s.taken).length+'/'+SHELLS.length;}shellHUD();
function updateShells(t){const px=PL.veh?PL.veh.x:PL.x,py=PL.veh?PL.veh.y:PL.y,pz=PL.veh?PL.veh.z:PL.z;
 for(const s of SHELLS){if(s.taken||s.where!==WORLD)continue;s.s.rotation.y=t*2;s.s.position.y=Math.sin(t*2+s.id)*.25;
  if(Math.hypot(s.x-px,s.z-pz)<2.2&&Math.abs(s.y-py-1)<3){s.taken=true;s.g.visible=false;GOT.push(s.id);try{localStorage.setItem('nova_shells',JSON.stringify(GOT));}catch(e){}sfx('coin');shellHUD();
   const n=SHELLS.filter(q=>q.taken).length;toast(n===SHELLS.length?'🏆 Tous les coquillages dorés !':'🐚 Coquillage doré '+n+'/'+SHELLS.length,1800);}}}

/* ================= LIEU ACTUEL ================= */
function placeName(){if(WORLD==='volcan')return'🌋 Cœur du volcan';const x=PL.veh?PL.veh.x:PL.x,z=PL.veh?PL.veh.z:PL.z,y=PL.veh?PL.veh.y:PL.y;
 if(PL.veh&&PL.veh.kind==='plane'&&PL.veh.air)return'✈️ '+Math.round(y)+' m d\'altitude';
 if(PL.state==='chute'||PL.state==='fall')return'🪂 '+Math.round(y-groundAt(x,z))+' m';
 const vd=Math.hypot(x-V.x,z-V.z);if(vd<34&&y>60)return'⛰️ Sommet du volcan';if(vd<110&&H(x,z)>25)return'🌋 Pentes du volcan';
 if(Math.hypot(x-ISLET.x,z-ISLET.z)<45)return'🏝️ Îlot des Tortues';if(Math.hypot(x-TOWN.x,z-TOWN.z)<70)return'🏘️ Port-Nova';if(Math.hypot(x-HOTEL.x,z-HOTEL.z)<45)return'🏨 Hôtel Nova';
 if(Math.hypot(x-COURT.x,z-COURT.z)<35)return'🏀 Terrain de basket';if(Math.hypot(x-RANGE.x,z-RANGE.z)<45)return'🏹 Pré des archers';if(Math.hypot(x-LH.x,z-LH.z)<40)return'🗼 Cap du Phare';
 if(H(x,z)<-1)return'🌊 En mer';if(H(x,z)<2.5)return'🏖️ Plage';return'🌴 Île Nova';}

/* ================= BOUCLE ================= */
let last=performance.now(),frame=0,lastPlace='';
function tick(dt){TIME+=dt;frame++;cycleTick(dt);LAVA_MAT.uniforms.t.value=TIME;
 if(MG.on){mgUpdate(dt);IN.actPressed=IN.jumpPressed=false;return;}
 if($('map').style.display==='flex'){IN.actPressed=IN.jumpPressed=false;return;}
 for(const v of VEH)updateVehicle(v,dt);
 updatePlayer(dt);
 if(PL.state==='walk'&&PL.ground&&WORLD==='volcan'&&caveGround(PL.x,PL.z)===0)PL.safe={x:PL.x,z:PL.z};
 updateContext();
 IN.actPressed=IN.jumpPressed=false;
 updateBooms(dt);updateShells(TIME);
 for(const m of MARKERS){m.sp.position.y=3+Math.sin(TIME*2.5)*.25;}
 updateCamera(dt);
 if(WORLD==='ile'){updateNPCs(dt,PL.x,PL.z);CLOUDS.rotation.y=TIME*.004;NOVA_HOLO.update(TIME);WINDU.value=TIME;if(window.LHBEAM)LHBEAM.rotation.y=TIME*.6;}else updateCave(TIME,dt);}
function draw(){if(MG.on){if(BLOOM){BLOOM.strength=.3;BLOOM.threshold=1.6;BLOOM.radius=.4;}if(window.FINALPASS)FINALPASS.uniforms.exposure.value=1;renderFX(MG.scene,MG.cam);return;}
 if(frame%3===0||!draw.done){applyCycle();draw.done=1;}
 if(WORLD==='ile'){const fx=PL.veh?PL.veh.x:PL.x,fz=PL.veh?PL.veh.z:PL.z,fy=PL.veh?PL.veh.y:PL.y;
  updateWater(TIME,camera.position.x,camera.position.z);updateSmoke(TIME);
  sun.position.set(fx+SUNDIR.x*150,fy+SUNDIR.y*150,fz+SUNDIR.z*150);sun.target.position.set(fx,fy,fz);SKY.position.copy(camera.position);
  renderFX(scene,camera);}else renderFX(caveScene,camera);}
function loop(now){requestAnimationFrame(loop);if(window.NOLOOP){last=now;return;}let dt=Math.min(.05,(now-last)/1000);last=now;tick(dt);draw();if(MG.on)return;
 if(frame%10===0){$('bTime').textContent=(SKYU.night.value>.5?'🌙 ':'☀️ ')+heureTxt();if(frame%300===0){try{localStorage.setItem('nova_heure',CYC.ph)}catch(e){}}drawMap($('mini'),236,170,PL.veh?PL.veh.x:PL.x,PL.veh?PL.veh.z:PL.z);const pn=placeName();if(pn!==lastPlace){lastPlace=pn;$('place').textContent=pn;}
  const sp=$('speedo');if(PL.veh&&PL.veh.kind==='plane'){sp.style.display='block';sp.textContent='Vitesse '+Math.round(PL.veh.speed*3.6)+' km/h · Gaz '+Math.round(PL.veh.thr*100)+'%'+(PL.veh.air?'':(PL.veh.speed<22?' · décolle à 80 km/h':' · tire ⬆️ pour décoller'));}
  else if(PL.veh){sp.style.display='block';sp.textContent=Math.round(Math.abs(PL.veh.speed)*3.6)+' km/h';}else sp.style.display='none';}
}
setupFX();resize();
camera.position.set(PL.x,PL.y+4,PL.z+8);
// pré-compilation
renderer.compile(scene,camera);
$('load').style.display='none';$('play').style.display='inline-block';
$('play').onclick=()=>{audioInit();$('title').style.display='none';$('hud').style.display='block';CAM.yaw=PL.yaw+Math.PI;
 try{const d=document.documentElement;if(d.requestFullscreen&&matchMedia('(pointer:coarse)').matches)d.requestFullscreen().catch(()=>{});}catch(e){}
 toast('Bienvenue sur l\'Île Nova ! 🌴',2200);setTimeout(()=>toast('Trouve les 20 coquillages dorés 🐚',2400),2600);};
requestAnimationFrame(loop);
window.__G={CYC,applyCycle,tick,draw,sim:(n,dt)=>{for(let i=0;i<n;i++)tick(dt||1/30);},PL,VEH,MG,activity,SHELLS,MARKERS,H,TOWN,CAVE,RIM,PIER,LH,ISLET,HOTEL,COURT,RANGE,BOWL,WORLD:()=>WORLD,enterVeh,exitVeh,IN,BW,BK,AR,throwBall,moveWorld,keys};
