<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Turbo Kart Royaume</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#4fb84c;overflow:hidden;font-family:'Baloo 2',system-ui,sans-serif;color:#1f2937}
#wrap{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#top{display:flex;align-items:center;gap:6px;padding:8px 8px 6px;background:linear-gradient(#1e3a8a,#1e40af);color:#fff;flex:none;box-shadow:0 3px 8px #0004;z-index:2}
.pill{display:flex;flex-direction:column;justify-content:center;background:#0005;border-radius:12px;padding:2px 10px;line-height:1.05;min-height:42px}
.pill b{font-size:19px;font-weight:800;white-space:nowrap}
.pill small{font-size:12px;opacity:.85;white-space:nowrap}
#pCoins{flex:1;min-width:0}
#pCoins b{color:#fde047}
.tb{width:44px;height:44px;border-radius:12px;border:none;background:#fff2;color:#fff;font-size:21px;position:relative;flex:none;font-family:inherit}
.tb:active{transform:scale(.94)}
.badge{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:10px;background:#ef4444;color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 4px;box-shadow:0 2px 0 #b91c1c}
#stage{flex:1;position:relative;min-height:0}
#c{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#bas{flex:none;background:#fff8ee;border-radius:18px 18px 0 0;padding:8px 10px 10px;box-shadow:0 -4px 14px #0003;z-index:2}
#infos{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:800;color:#6b4f2a;margin:0 2px 5px;white-space:nowrap}
#infos i{font-style:normal;color:#a08560;font-weight:600}
#vNext{overflow:hidden;text-overflow:ellipsis}
#garage{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{height:52px;border-radius:12px;background:#efe3cf;box-shadow:inset 0 2px 0 #0001;display:grid;place-items:center;position:relative;color:#b9a684;font-size:18px}
.slot.lock{background:#e8dfd1;opacity:.6}
.slot.cible{background:#d9f99d;box-shadow:0 0 0 3px #65a30d}
.kv{position:relative;width:100%;height:100%;display:grid;place-items:center;touch-action:none;cursor:grab}
.kv b{position:absolute;right:4px;top:3px;min-width:22px;height:20px;border-radius:10px;color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center;box-shadow:0 2px 0 #0003;padding:0 4px}
.kv.src{opacity:.35}
.kv.ghost{position:fixed;width:64px;height:60px;z-index:50;pointer-events:none;filter:drop-shadow(0 6px 8px #0005)}
.kv.pop{animation:pop .3s}
.kv.merge{animation:merge .45s}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes merge{0%{transform:scale(1.5);filter:brightness(2)}100%{transform:scale(1);filter:none}}
#actions{display:flex;gap:8px;margin-top:8px}
#bBuy{flex:1;height:56px;border:none;border-radius:16px;background:#22c55e;color:#fff;box-shadow:0 4px 0 #15803d;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit}
#bBuy b{display:block;font-size:19px;line-height:1}
#bBuy small{display:block;font-size:13px;font-weight:600;opacity:.95}
#bBuy:disabled{background:#cbd5e1;box-shadow:0 4px 0 #94a3b8}
#bBuy.vente{background:#ef4444;box-shadow:0 4px 0 #b91c1c}
#bBuy:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #15803d}
#bBuy .mini{background:#fff;border-radius:10px;padding:2px 3px;display:grid}
#bTurbo{width:110px;height:56px;border:none;border-radius:16px;font-family:inherit;font-size:20px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;gap:4px}
#bTurbo span{font-size:15px}
#bTurbo.pret{background:#f97316;box-shadow:0 4px 0 #c2410c;animation:pulse 1.2s infinite}
#bTurbo.act{background:#facc15;color:#7c2d12;box-shadow:0 4px 0 #ca8a04}
#bTurbo.off{background:#cbd5e1;box-shadow:0 4px 0 #94a3b8}
@keyframes pulse{50%{transform:scale(1.05)}}
#voile{position:fixed;left:0;top:0;right:0;bottom:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:40}
#voile.on{display:flex}
#sheet{width:100%;max-width:520px;max-height:82vh;overflow:auto;background:#fff8ee;border-radius:20px 20px 0 0;padding:12px 14px calc(16px + env(safe-area-inset-bottom));animation:monte .2s}
@keyframes monte{from{transform:translateY(40px);opacity:0}}
.sh{display:flex;align-items:center;justify-content:space-between}
.sh h2{margin:4px 0;font-size:22px}
.x{width:40px;height:40px;border:none;border-radius:12px;background:#ef4444;color:#fff;font-size:18px;font-weight:800}
#sheet p{font-size:15px;line-height:1.4;color:#4b3a24;margin:8px 0}
.carte{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:8px 10px;margin:8px 0;box-shadow:0 2px 0 #eadcc6}
.carte .ic{font-size:26px;width:44px;height:44px;border-radius:12px;background:#fdf1dc;display:grid;place-items:center;flex:none}
.carte .inf{flex:1;min-width:0;font-size:14px;line-height:1.25}
.carte .inf small{color:#8a7356;font-weight:800}
.carte .ds{font-size:12.5px;color:#6b5a45}
.carte .ef{font-size:12.5px;color:#15803d;font-weight:800}
.achat{min-width:92px;height:44px;border:none;border-radius:12px;background:#22c55e;color:#fff;font-family:inherit;font-weight:800;font-size:15px;box-shadow:0 3px 0 #15803d;flex:none}
.achat:disabled{background:#cbd5e1;box-shadow:0 3px 0 #94a3b8}
.mx{min-width:92px;text-align:center;font-weight:800;color:#ca8a04}
.bloc{background:#fff;border-radius:14px;padding:10px 12px;margin:8px 0;font-size:15px;box-shadow:0 2px 0 #eadcc6}
.gros-v{font-size:26px;font-weight:800;text-align:center}
.gros{width:100%;height:54px;border:none;border-radius:16px;background:#2563eb;color:#fff;font-family:inherit;font-size:18px;font-weight:800;box-shadow:0 4px 0 #1e3a8a;margin-top:8px}
.gros:disabled{background:#cbd5e1;box-shadow:0 4px 0 #94a3b8}
.gros.rouge{background:#ef4444;box-shadow:0 4px 0 #b91c1c}
.ligne{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:14px;padding:8px 12px;margin:8px 0;font-weight:800;font-size:16px}
.sw{width:56px;height:30px;border-radius:15px;border:none;background:#cbd5e1;position:relative}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;transition:left .2s}
.sw.on{background:#22c55e}.sw.on::after{left:29px}
.pt{font-size:12px!important;color:#8a7356!important;text-align:center}
#toasts{position:fixed;left:50%;top:70px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;width:92%;max-width:420px;pointer-events:none}
.toast{background:#1e293bee;color:#fff;border-radius:14px;padding:8px 12px;font-size:14px;font-weight:600;text-align:center;box-shadow:0 6px 16px #0004;animation:monte .25s}
.toast.out{opacity:0;transition:opacity .4s}
</style></head><body>
<div id="wrap">
  <div id="top">
    <div class="pill" id="pCoins"><b>🪙 <span id="vCoins">0</span></b><small id="vRev">+0/s</small></div>
    <div class="pill" id="pTroph" style="display:none"><b>🏆 <span id="vTroph">0</span></b><small>trophées</small></div>
    <button class="tb" id="bUp" aria-label="Améliorations">⬆️<span class="badge" id="upBadge" style="display:none"></span></button>
    <button class="tb" id="bGP" aria-label="Grand Prix">🏆<span class="badge" id="gpBadge" style="display:none">!</span></button>
    <button class="tb" id="bReg" aria-label="Réglages">⚙️</button>
  </div>
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="bas">
    <div id="infos"><span id="vNext"></span><span id="vSaison"></span></div>
    <div id="garage"></div>
    <div id="actions"><button id="bBuy"></button><button id="bTurbo" class="pret">🚀 <span>Turbo</span></button></div>
  </div>
</div>
<div id="voile"><div id="sheet"></div></div>
<div id="toasts"></div>
<script>// ======================= TURBO KART ROYAUME — karts à fusionner =======================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 300, H = 300, DPR = 1;
function rs() { DPR = Math.min(2.5, devicePixelRatio || 1); const r = cv.getBoundingClientRect(); W = Math.max(50, r.width); H = Math.max(50, r.height); cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); }
addEventListener('resize', () => { rs(); });
const TILT=.8;
const CTRL=[[500,250],[740,270],[860,380],[860,560],[760,700],[860,860],[860,1040],[720,1150],[500,1160],[280,1150],[140,1040],[140,860],[240,700],[140,560],[140,380],[260,270]];
function cat(a,b,c,d,t){const t2=t*t,t3=t2*t;return[0,1].map(k=>.5*(2*b[k]+(-a[k]+c[k])*t+(2*a[k]-5*b[k]+4*c[k]-d[k])*t2+(-a[k]+3*b[k]-3*c[k]+d[k])*t3))}
const P=[];for(let i=0;i<CTRL.length;i++)for(let k=0;k<24;k++){const n=CTRL.length;P.push(cat(CTRL[(i-1+n)%n],CTRL[i],CTRL[(i+1)%n],CTRL[(i+2)%n],k/24))}
const N=P.length;const SEG=[];let LEN=0;for(let i=0;i<N;i++){const a=P[i],b=P[(i+1)%N],l=Math.hypot(b[0]-a[0],b[1]-a[1]);SEG.push(l);LEN+=l}
const NRM=P.map((p,i)=>{const q=P[(i+1)%N],dx=q[0]-p[0],dy=q[1]-p[1],l=Math.hypot(dx,dy);return[-dy/l,dx/l]});
const TW=86;
function at(d,off){d=((d%LEN)+LEN)%LEN;let i=0;while(i<N-1&&d>SEG[i]){d-=SEG[i];i++}const f=d/SEG[i],a=P[i],b=P[(i+1)%N];
 return{x:a[0]+(b[0]-a[0])*f+NRM[i][0]*off,y:a[1]+(b[1]-a[1])*f+NRM[i][1]*off,ang:Math.atan2(b[1]-a[1],b[0]-a[0])}}
let sc,ox,oy;function view(){sc=Math.min(W/1000,(H-30)/(1300*TILT));ox=(W-1000*sc)/2;oy=(H-1300*TILT*sc)/2+16}
const X=x=>ox+x*sc,Y=y=>oy+y*TILT*sc;
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
function nearT(x,y){let b=1e9;for(let i=0;i<N;i+=2){const d=Math.hypot(P[i][0]-x,P[i][1]-y);if(d<b)b=d}return b}
const deco=[];
for(let k=0;k<500&&deco.length<170;k++){const x=rnd()*1000,y=rnd()*1300;if(nearT(x,y)<TW/2+30)continue;if(x>330&&x<670&&y>420&&y<1080)continue;
 const r=rnd();deco.push({x,y,t:r<.32?'tree':r<.55?'pink':r<.72?'flower':r<.82?'block':r<.92?'pipe':'egg',s:.8+rnd()*.5,c:rnd()})}
[[370,480,'tree'],[630,480,'tree'],[360,1050,'pink'],[640,1050,'pink'],[350,580,'block'],[650,580,'block']].forEach(d=>deco.push({x:d[0],y:d[1],t:d[2],s:1,c:.3}));

/* ---------------- données ---------------- */
const fmtS = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 1000) return n < 10 ? (Math.floor(n * 10) / 10).toString().replace('.', ',') : String(Math.floor(n));
  let e = 0; while (n >= 1000 && e < fmtS.length - 1) { n /= 1000; e++; }
  return (n >= 100 ? Math.floor(n) : n >= 10 ? (Math.floor(n * 10) / 10) : (Math.floor(n * 100) / 100)).toString().replace('.', ',') + ' ' + fmtS[e];
}
const KNOMS = ['Caisse à savon', 'Kart en bois', 'Petit bolide', 'Kart sport', 'Kart turbo', 'Kart champion', 'Kart fusée', 'Kart royal', 'Kart doré', 'Kart cristal', 'Kart dragon', 'Kart arc-en-ciel', 'Kart foudre', 'Kart galaxie', 'Kart légendaire', 'Kart mythique', 'Kart divin', 'Kart cosmique', 'Kart infini', 'Kart ultime'];
const KCOLS = ['#a16207', '#92400e', '#e11d48', '#2563eb', '#16a34a', '#f59e0b', '#9333ea', '#1d4ed8', '#eab308', '#22d3ee', '#dc2626', '#ec4899', '#facc15', '#7c3aed', '#f97316', '#14b8a6', '#fde047', '#6366f1', '#ffffff', '#111827'];
function kNom(L) { return KNOMS[Math.min(KNOMS.length - 1, L - 1)] + (L > KNOMS.length ? ' +' + (L - KNOMS.length) : ''); }
function kCol(L) { return KCOLS[(L - 1) % KCOLS.length]; }
/* saisons du circuit : chacune multiplie les gains */
const SAISONS = [
  { nom: 'Printemps', lv: 1, mult: 1, g0: '#6fd06a', g1: '#4fb84c', h0: '#8ee487', h1: '#33a043', tr: ['#6ee07a', '#2a8a3a'], pk: ['#fde4f0', '#f472b6'], lk: ['#a5f3fc', '#22d3ee'], rd: '#3b3f4a', rd2: '#474c58', bd: '#ef4444' },
  { nom: 'Désert', lv: 6, mult: 2, g0: '#f1cf8a', g1: '#dcae62', h0: '#f6dca6', h1: '#c99a50', tr: ['#b5d36a', '#5f8a2a'], pk: ['#ffe2b8', '#fb923c'], lk: ['#bdf6ff', '#2dd4bf'], rd: '#5b4636', rd2: '#6b5442', bd: '#f97316' },
  { nom: 'Neige', lv: 11, mult: 4, g0: '#f4f8fc', g1: '#d9e6f2', h0: '#ffffff', h1: '#c3d6ea', tr: ['#5e9c7a', '#245a42'], pk: ['#ffffff', '#c7d2fe'], lk: ['#e0f2fe', '#7dd3fc'], rd: '#4b5563', rd2: '#5b6575', bd: '#3b82f6' },
  { nom: 'Nuit néon', lv: 16, mult: 8, g0: '#1d2656', g1: '#121a3a', h0: '#2f3b80', h1: '#141d48', tr: ['#7cf5ff', '#3b5bdb'], pk: ['#ffd6ff', '#d946ef'], lk: ['#a78bfa', '#22d3ee'], rd: '#0b1026', rd2: '#141a38', bd: '#22d3ee' },
];
function saison() { let s = SAISONS[0]; for (const x of SAISONS) if (S.best >= x.lv) s = x; return s; }
const UPGS = [
  { id: 'moteur', ic: '⚙️', nom: 'Moteurs', desc: 'Tous les karts roulent plus vite.', base: 80, gr: 2.5, max: 20, eff: L => 1 + 0.05 * L, txt: v => 'vitesse ×' + v.toFixed(2).replace('.', ',') },
  { id: 'sponsor', ic: '💰', nom: 'Sponsors', desc: 'Chaque tour rapporte plus.', base: 150, gr: 3, max: 30, eff: L => Math.pow(1.1, L), txt: v => 'gains ×' + (v < 10 ? v.toFixed(2).replace('.', ',') : fmt(v)) },
  { id: 'garage', ic: '🏠', nom: 'Agrandir le garage', desc: 'Une place de plus pour un kart.', base: 500, gr: 6, max: 4, eff: L => 12 + L, txt: v => v + ' places' },
  { id: 'turbo', ic: '🚀', nom: 'Turbo', desc: 'Le turbo dure plus longtemps.', base: 300, gr: 2.2, max: 10, eff: L => 15 + 3 * L, txt: v => v + ' s de turbo' },
  { id: 'fusion', ic: '🤖', nom: 'Fusion automatique', desc: 'Les karts pareils fusionnent tout seuls.', base: 2000, gr: 2.5, max: 8, eff: L => L ? Math.max(1, 12 - 1.4 * L) : 0, txt: v => v ? 'toutes les ' + v.toFixed(1).replace('.', ',') + ' s' : 'désactivée' },
  { id: 'achat', ic: '🛒', nom: 'Achat automatique', desc: 'Achète un kart tout seul dès que c’est possible.', base: 5000, gr: 3, max: 6, eff: L => L ? Math.max(1.5, 10 - 1.5 * L) : 0, txt: v => v ? 'toutes les ' + v.toFixed(1).replace('.', ',') + ' s' : 'désactivé' },
];
const UPGM = {}; UPGS.forEach(u => UPGM[u.id] = u);

/* ---------------- sauvegarde ---------------- */
const KEY = 'turbokart_fusion_v1';
function neuf() { return { coins: 30, slots: new Array(16).fill(0), best: 1, ach: {}, upg: {}, troph: 0, gp: 0, totalTours: 0, total: 0, last: Date.now(), son: true, vu: false }; }
let S = neuf();
try { const o = JSON.parse(localStorage.getItem(KEY) || 'null'); if (o) { Object.assign(S, o); if (!Array.isArray(S.slots)) S.slots = neuf().slots; while (S.slots.length < 16) S.slots.push(0); if (!S.ach || typeof S.ach !== 'object') S.ach = {}; } } catch (e) { }
if (!S.slots.some(x => x > 0)) S.slots[0] = 1;
function save() { S.last = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
function lv(id) { return S.upg[id] | 0; }
function ef(id) { return UPGM[id].eff(lv(id)); }
function upCost(u) { return Math.ceil(u.base * Math.pow(u.gr, lv(u.id))); }
function nbPlaces() { return ef('garage'); }

/* ---------------- économie ---------------- */
function vitesse(L) { return (130 + 14 * Math.min(L, 30) + 2 * Math.max(0, L - 30)) * ef('moteur'); }
function gainTour(L) { return 6 * Math.pow(2.05, L - 1) * ef('sponsor') * saison().mult * (1 + 0.1 * S.troph); }
function ecart(B) { return B <= 2 ? 1 : B <= 4 ? 2 : B <= 7 ? 3 : 4; }
function niveauAchat() { return Math.max(1, S.best - ecart(S.best)); }
function prixBase(L) { return 15 * Math.pow(4.4, L - 1); }
function prixAchat() { const L = niveauAchat(); return Math.ceil(prixBase(L) * Math.pow(1.16, S.ach[L] | 0)); }
function prixVente(L) { return Math.floor(prixBase(L) * 0.5); }
function revenuSec() { let r = 0; for (const k of karts) r += vitesse(k.L) * turboMul() / LEN * gainTour(k.L); return r; }
let turboT = 0, turboCD = 0;
function turboMul() { return turboT > 0 ? 2 : 1; }

/* ---------------- karts sur la piste ---------------- */
let karts = [], fx = [], pops = [];
function syncKarts() {
  const want = [];
  for (let i = 0; i < nbPlaces(); i++) if (S.slots[i] > 0) want.push({ i, L: S.slots[i] });
  const next = [];
  for (const w of want) {
    let k = karts.find(k => k.i === w.i);
    if (!k) k = { i: w.i, d: Math.random() * LEN, off: (Math.random() - 0.5) * TW * 0.6, boostT: 0, spin: 0, laps: 0 };
    k.L = w.L; k.col = kCol(w.L); next.push(k);
  }
  karts = next;
}
function step(dt) {
  if (turboT > 0) turboT -= dt; if (turboCD > 0) turboCD -= dt;
  for (const k of karts) {
    const v = vitesse(k.L) * turboMul() * (k.boostT > 0 ? 1.6 : 1);
    if (k.boostT > 0) k.boostT -= dt;
    const d0 = k.d; k.d += v * dt;
    k.off += (Math.sin((k.d + k.i * 300) / 180) * TW * 0.3 - k.off) * Math.min(1, dt * 0.8);
    if (Math.floor(k.d / LEN) > Math.floor(d0 / LEN)) {
      const g = gainTour(k.L); S.coins += g; S.total += g; S.totalTours++; k.laps++;
      const p = at(k.d, k.off); pops.push({ x: p.x, y: p.y, t: 0, txt: '+' + fmt(g) });
      if (pops.length > 30) pops.shift();
      if (Math.random() < 0.25) son('piece');
    }
  }
  for (const f of fx) f.t += dt; fx = fx.filter(f => f.t < 0.8);
  for (const p of pops) p.t += dt; pops = pops.filter(p => p.t < 1.1);
}

/* ---------------- dessin ---------------- */
function drawDeco(d, T) {
  const s = d.s * sc * 1.2; ctx.save(); ctx.translate(X(d.x), Y(d.y)); ctx.scale(s, s);
  ctx.fillStyle = '#0003'; ctx.beginPath(); ctx.ellipse(4, 2, 16, 6, 0, 0, 7); ctx.fill();

  for (const k of karts) { const p = at(k.d, k.off), dx = X(p.x) - mx, dy = Y(p.y) - 28 * sc - my, d = Math.hypot(dx, dy); if (d < bd) { bd = d; best = k; } }
  if (best) { best.boostT = 2; const p = at(best.d, best.off); fx.push({ x: p.x, y: p.y, t: 0, e: '💨' }); son('turbo'); vib(8); }
});
$('bBuy').addEventListener('click', () => acheter(false));
$('bTurbo').addEventListener('click', () => {
  if (turboT > 0 || turboCD > 0) { son('non'); return; }
  turboT = ef('turbo'); turboCD = turboT + 60; son('turbo'); vib(25); toast('🚀 Turbo ! Tous les karts vont 2 fois plus vite');
});
/* ---------------- fenêtres ---------------- */
function ouvrir(html) { $('sheet').innerHTML = html; $('voile').classList.add('on'); }
function fermer() { $('voile').classList.remove('on'); }
$('voile').addEventListener('click', e => { if (e.target === $('voile')) fermer(); });
function upgHTML() {
  let h = '<div class="sh"><h2>⬆️ Améliorations</h2><button class="x" data-a="fermer">✕</button></div>';
  for (const u of UPGS) {
    const L = lv(u.id), mx = L >= u.max, c = upCost(u);
    h += '<div class="carte"><div class="ic">' + u.ic + '</div><div class="inf"><b>' + u.nom + '</b> <small>niv. ' + L + '/' + u.max + '</small><div class="ds">' + u.desc + '</div><div class="ef">' + u.txt(u.eff(L)) + (mx ? '' : ' → <b>' + u.txt(u.eff(L + 1)) + '</b>') + '</div></div>'
      + (mx ? '<div class="mx">MAX</div>' : '<button class="achat" data-up="' + u.id + '"' + (S.coins >= c ? '' : ' disabled') + '>🪙 ' + fmt(c) + '</button>') + '</div>';
  }
  return h;
}
function gainGP() { if (S.best < 12) return 0; return Math.floor(3 * Math.pow(1.5, S.best - 12)); }
function gpHTML() {
  const g = gainGP();
  return '<div class="sh"><h2>🏆 Grand Prix</h2><button class="x" data-a="fermer">✕</button></div>'
    + '<p>Le Grand Prix s’ouvre quand tu as un <b>kart de niveau 12</b>. Tu recommences avec un garage vide et sans améliorations, mais tu gagnes des <b>trophées</b> : chaque trophée donne <b>+10 % de gains pour toujours</b>.</p>'
    + '<div class="bloc">🏆 Trophées : <b>' + S.troph + '</b> (gains +' + (S.troph * 10) + ' %) · Grands Prix gagnés : ' + S.gp + '</div>'
    + '<div class="bloc">' + (g > 0 ? 'Avec ton meilleur kart (niv. ' + S.best + '), tu gagnerais <b>' + g + ' trophée' + (g > 1 ? 's' : '') + '</b>. Plus ton kart est haut, plus tu en gagnes.' : 'Fusionne jusqu’au <b>niveau 12</b> pour ouvrir le Grand Prix (meilleur kart : niv. ' + S.best + ').') + '</div>'
    + '<button class="gros" data-a="gp"' + (g > 0 ? '' : ' disabled') + '>Courir le Grand Prix</button>';
}
function regHTML() {
  return '<div class="sh"><h2>⚙️ Réglages</h2><button class="x" data-a="fermer">✕</button></div>'
    + '<div class="ligne"><span>🔊 Sons</span><button class="sw' + (S.son ? ' on' : '') + '" data-a="son"></button></div>'
    + '<div class="bloc">Tours bouclés : <b>' + fmt(S.totalTours) + '</b> · Pièces gagnées : <b>' + fmt(S.total) + '</b></div>'
    + '<button class="gros rouge" data-a="reset">🗑️ Réinitialiser le jeu</button>'
    + '<p class="pt">Turbo Kart Royaume · fusion v2.0</p>';
}
$('sheet').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.up) {
    const u = UPGM[b.dataset.up], c = upCost(u);
    if (lv(u.id) >= u.max || S.coins < c) { son('non'); return; }
    S.coins -= c; S.upg[u.id] = lv(u.id) + 1; son('achat'); vib(10);
    if (u.id === 'garage') { syncKarts(); renderGarage(); }
    save(); $('sheet').innerHTML = upgHTML(); renderHUD(); return;
  }
  const a = b.dataset.a;
  if (a === 'fermer') fermer();
  else if (a === 'son') { S.son = !S.son; b.classList.toggle('on', S.son); save(); }
  else if (a === 'gp') {
    const g = gainGP(); if (g <= 0) return;
    if (!b.dataset.ok) { b.dataset.ok = '1'; b.textContent = 'Sûr ? Touche encore pour courir (garage remis à zéro)'; return; }
    S.troph += g; S.gp++; S.coins = 30; S.slots = new Array(16).fill(0); S.slots[0] = 1; S.best = 1; S.ach = {}; S.upg = {}; turboT = 0; turboCD = 0;
    syncKarts(); renderGarage(); renderHUD(); save(); fermer(); son('niveau');
    toast('🏆 Grand Prix gagné ! <b>+' + g + ' trophée' + (g > 1 ? 's' : '') + '</b> · gains +' + (S.troph * 10) + ' % pour toujours');
  } else if (a === 'reset') {
    if (!b.dataset.ok) { b.dataset.ok = '1'; b.textContent = 'Sûr ? Touche encore pour tout effacer'; return; }
    const son0 = S.son; S = neuf(); S.son = son0; S.slots[0] = 1; S.vu = true; turboT = 0; turboCD = 0;
    syncKarts(); renderGarage(); renderHUD(); save(); fermer(); toast('Jeu réinitialisé');
  }
});
$('bUp').addEventListener('click', () => ouvrir(upgHTML()));
$('bGP').addEventListener('click', () => ouvrir(gpHTML()));
$('bReg').addEventListener('click', () => ouvrir(regHTML()));
function aide() {
  ouvrir('<div class="sh"><h2>🏁 Turbo Kart Royaume</h2></div>'
    + '<p>Tes karts roulent <b>tout seuls</b> sur le circuit. <b>Chaque tour rapporte des pièces.</b></p>'
    + '<p>• <b>Achète</b> des karts avec le bouton vert<br>• <b>Fais glisser</b> un kart sur un kart <b>pareil</b> : ils fusionnent en un kart plus rapide qui rapporte bien plus<br>• Le <b>Turbo</b> double la vitesse de tous les karts<br>• Touche un kart sur la piste pour un petit coup d’accélérateur<br>• Nouvelles <b>saisons</b> du circuit aux niveaux 6, 11 et 16 (gains ×2, ×4, ×8)<br>• Glisse un vieux kart sur le bouton <b>Acheter</b> pour le vendre<br>• Au niveau 12, le <b>Grand Prix</b> te donne des trophées pour toujours</p>'
    + '<button class="gros" data-a="fermer">C’est parti !</button>');
}
/* ---------------- gains hors ligne ---------------- */
function horsLigne() {
  const sec = Math.min(3 * 3600, (Date.now() - (S.last || Date.now())) / 1000);
  if (sec < 60) return;
  const g = revenuSec() * sec * 0.5; if (g < 1) return;
  S.coins += g; S.total += g; save();
  ouvrir('<div class="sh"><h2>🏁 Bon retour !</h2></div><p>Pendant ton absence (' + Math.round(sec / 60) + ' min), tes karts ont gagné :</p><div class="bloc gros-v">🪙 ' + fmt(g) + '</div><p class="pt">Les karts gagnent la moitié de leurs pièces quand tu n’es pas là (3 h maximum).</p><button class="gros" data-a="fermer">Super !</button>');
}
/* ---------------- boucle ---------------- */
let last = 0, ht = 0, autoF = 0, autoA = 0, saveT = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000 || 0); last = now;
  step(dt);
  const fi = ef('fusion'); if (fi > 0) { autoF += dt; if (autoF >= fi) { autoF = 0; fusionAuto(); } }
  const ai = ef('achat'); if (ai > 0) { autoA += dt; if (autoA >= ai) { autoA = 0; acheter(true); } }
  const rr = cv.getBoundingClientRect(); if (Math.abs(rr.width - W) > 0.5 || Math.abs(rr.height - H) > 0.5) rs();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); view(); drawWorld();
  if ((ht += dt) > .25) { ht = 0; renderHUD(); }
  if ((saveT += dt) > 10) { saveT = 0; save(); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else horsLigne(); });
addEventListener('pagehide', save);
/* zone sûre (encoche) dans Nova App, et son débloqué au premier toucher */
try { if (window.Android && Android.safeArea) { const sa = String(Android.safeArea()).split(',').map(Number); if (sa[1] > 0) $('wrap').style.paddingTop = sa[1] + 'px'; if (sa[3] > 0) $('wrap').style.paddingBottom = sa[3] + 'px'; } } catch (e) { }
addEventListener('pointerdown', () => { try { if (!S.son) return; if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) { } }, true);
rs(); syncKarts(); renderGarage(); renderHUD();
if (!S.vu) { S.vu = true; save(); aide(); } else horsLigne();
requestAnimationFrame(frame);
window.__kart = { S: () => S, acheter, fusionner, gainGP, revenuSec, karts: () => karts };
