<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nova Titan : Neon City</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{background:#0d0b16;color:#f2f0fa;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:460px;margin:0 auto;padding:10px 10px 24px}
header{text-align:center;padding:4px 0 8px}
header .u{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:700}
header h1{font-size:24px;font-weight:900;margin-top:2px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#hud{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px}
#hud .st{color:var(--acc)}
#gold{display:flex;align-items:center;gap:6px;color:#ffd84a}
.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b0,#ffc61a 55%,#b37a00);box-shadow:0 0 0 1.5px #6b4600 inset;display:inline-block}
#scene{position:relative;width:100%;aspect-ratio:360/400;margin-top:8px;border-radius:16px;overflow:hidden;background:#000;touch-action:manipulation;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#c2,#three,#three canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#c2{image-rendering:pixelated}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#mon{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:72%;text-align:center;pointer-events:none}
#mname{font-weight:900;font-size:15px;text-shadow:0 2px 3px #000,0 0 2px #000}
#mname.boss{color:#ff5a5a;font-size:17px}
#hpbar{margin-top:4px;height:14px;border-radius:8px;background:rgba(0,0,0,.6);border:2px solid rgba(0,0,0,.7);overflow:hidden;position:relative}
#hpbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ff6a6a,#d42020);transition:width .12s}
#hpbar span{position:absolute;inset:0;font-size:10px;line-height:10px;font-weight:800;text-shadow:0 1px 2px #000}
#hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-weight:800;font-size:13px;opacity:.85;text-shadow:0 2px 3px #000;animation:pulse 1.4s infinite;pointer-events:none}
@keyframes pulse{50%{opacity:.35}}
.dmg{position:absolute;font-weight:900;font-size:20px;color:#fff;text-shadow:0 2px 0 #000,0 0 3px #000,1px 1px 0 #000,-1px -1px 0 #000;animation:up .9s ease-out forwards;white-space:nowrap;transform:translate(-50%,-50%)}
.dmg.crit{font-size:28px;color:#ffe14a}
.dmg.ally{font-size:15px;color:var(--acc)}
@keyframes up{0%{opacity:0;margin-top:8px;scale:.6}15%{opacity:1;scale:1.15}100%{opacity:0;margin-top:-60px;scale:1}}
.hit{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:radial-gradient(circle,#fff 0,rgba(255,255,255,.9) 18%,var(--acc) 35%,transparent 62%);animation:pop .22s ease-out forwards}
@keyframes pop{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.4);opacity:0}}
.fc{position:absolute;width:14px;height:14px;margin:-7px;transition:transform .7s cubic-bezier(.5,-0.4,.7,1),opacity .7s}
#banner{position:absolute;top:42%;left:0;right:0;text-align:center;font-size:34px;font-weight:900;color:#ff4a4a;text-shadow:0 3px 0 #000,0 0 12px rgba(255,0,0,.6);opacity:0;pointer-events:none;transition:opacity .3s}
#modes{display:flex;gap:6px;margin-top:10px;align-items:center}
#modes b{font-size:12px;opacity:.7;margin-right:2px}
#modes button{flex:1;padding:11px 0;border-radius:12px;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#fff;font-weight:900;font-size:14px}
#modes button.on{background:var(--acc);color:#111;border-color:var(--acc)}
.row{display:flex;align-items:center;gap:10px;margin-top:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:9px 10px}
.row .ic{width:38px;height:38px;border-radius:10px;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.row .tx{flex:1;font-size:12px;opacity:.85}
.row .tx b{display:block;font-size:14px;opacity:1}
.row button{border:none;border-radius:10px;padding:9px 10px;font-weight:900;font-size:13px;background:linear-gradient(#ffe066,#f0b400);color:#3a2700;display:flex;gap:5px;align-items:center;min-width:86px;justify-content:center}
.row button:disabled{filter:grayscale(1);opacity:.45}
#fiche{margin-top:12px;font-size:13px;line-height:1.5;background:rgba(255,255,255,.04);border-radius:12px;padding:10px 12px}
#fiche p{margin-bottom:4px}
#fiche b{color:var(--acc)}
#err{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;padding:20px;background:#000c;font-weight:700}
</style>
</head>
<body>
<div id="app">
  <header><div class="u" id="uni"></div><h1 id="gname"></h1></header>
  <div id="hud"><span class="st" id="stage"></span><span id="gold"><i class="coin"></i><span id="goldv">0</span></span></div>
  <div id="scene">
    <canvas id="c2"></canvas><div id="three"></div>
    <div id="fx"></div>
    <div id="mon"><div id="mname"></div><div id="hpbar"><i></i><span></span></div></div>
    <div id="banner">BOSS !</div>
    <div id="hint">Tape pour attaquer</div>
    <div id="err">La 3D n'a pas pu se charger sur cet appareil.</div>
  </div>
  <div id="modes"><b>Rendu</b><button data-m="3d">3D</button><button data-m="2d" class="on">2D dessiné</button><button data-m="px">Pixel</button></div>
  <div class="row"><div class="ic">⚔️</div><div class="tx"><b id="hname"></b><span id="htx"></span></div><button id="bh"><i class="coin"></i><span></span></button></div>
  <div class="row"><div class="ic">🛡️</div><div class="tx"><b id="aname"></b><span id="atx"></span></div><button id="ba"><i class="coin"></i><span></span></button></div>
  <div id="fiche"></div>
</div>
<script>
const T={"name": "Univers 2 · Cyberpunk néon", "game": "Nova Titan : Neon City", "pitch": "Une samouraï-hackeuse et son escouade nettoient une mégapole néon envahie par des machines, district après district.", "accent": "#28f0ff", "sky": ["#0b0620", "#3a1060"], "far": "#1d1240", "mid": "#140c2e", "ground": "#120a26", "props": "city", "hero": {"name": "Samouraï néon", "body": "#262a40", "skin": "#e9c4a4", "head": "visor", "weapon": "katana", "glow": "#28f0ff", "hair": "#15151f", "metal": "#3a3f55"}, "allies": [{"name": "Tireuse", "body": "#5a1e5e", "skin": "#d9a988", "head": "hairpink", "weapon": "gun", "glow": "#ff3cac", "hair": "#ff3cac"}, {"name": "Androïde", "body": "#c9d2e3", "skin": "#aab4c8", "head": "android", "weapon": "gun", "glow": "#7cff6b"}], "monsters": [{"name": "Drone tueur", "kind": "drone", "color": "#4a5068", "eye": "#ff2a4a"}, {"name": "Cyborg", "kind": "biped", "color": "#596079", "head": "android", "weapon": "claw", "eye": "#ff2a4a"}, {"name": "Mécha-sentinelle", "kind": "mech", "color": "#3d4358", "eye": "#ffb000"}], "boss": {"name": "Mécha Colosse", "kind": "mech", "color": "#2c3146", "eye": "#ff2a4a", "big": true}};
const W=360,H=400,GY=330;
const $=id=>document.getElementById(id);
document.documentElement.style.setProperty('--acc',T.accent);

/* ---------- couleurs ---------- */
function parse(c){if(c[0]==='#'){c=c.slice(1);return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)]}return c.match(/[\d.]+/g).slice(0,3).map(Number)}
function mixc(a,b,t){const A=parse(a),B=parse(b);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')'}
function shade(c,t){return t>0?mixc(c,'#ffffff',t):mixc(c,'#000000',-t)}
function rng(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}

/* ---------- état du jeu ---------- */
const S={stage:1,idx:1,hp:10,max:10,gold:0,hl:1,al:1,mode:'2d',dead:false,mon:null};
const A={t:0,hero:0,ally:[0,0],hurt:0,dying:0,spawn:1};
const isBoss=()=>S.idx===10;
const tapDmg=()=>Math.round(2*Math.pow(1.22,S.hl-1));
const allyDmg=()=>Math.round(1.5*Math.pow(1.28,S.al-1));
const hCost=()=>Math.round(6*Math.pow(1.45,S.hl-1));
const aCost=()=>Math.round(12*Math.pow(1.55,S.al-1));
function fmt(n){if(n<1e4)return''+n;const u=['K','M','B','T'];let i=-1;while(n>=1e3&&i<3){n/=1e3;i++}return n.toFixed(n<10?2:1)+u[i]}
function spawn(){
  const b=isBoss();
  S.mon=b?T.boss:T.monsters[(S.stage*2+S.idx)%T.monsters.length];
  S.max=Math.round(9*Math.pow(1.5,S.stage-1)*(b?7:1));S.hp=S.max;S.dead=false;
  A.spawn=0;A.dying=0;
  if(b){const bn=$('banner');bn.style.opacity=1;setTimeout(()=>bn.style.opacity=0,900)}
  ui();
}
function ui(){
  $('stage').textContent='Palier '+S.stage+' · '+(isBoss()?'BOSS':S.idx+'/10');
  $('goldv').textContent=fmt(S.gold);
  const mn=$('mname');mn.textContent=S.mon.name;mn.className=isBoss()?'boss':'';
  $('hpbar').querySelector('i').style.width=Math.max(0,S.hp/S.max*100)+'%';
  $('hpbar').querySelector('span').textContent=fmt(Math.max(0,S.hp))+' / '+fmt(S.max);
  $('hname').textContent=T.hero.name+' · Niv. '+S.hl;$('htx').textContent='Dégâts par tape : '+fmt(tapDmg());
  $('aname').textContent=T.allies.map(a=>a.name).join(' & ')+' · Niv. '+S.al;$('atx').textContent='Dégâts auto : '+fmt(allyDmg())+' /s';
  $('bh').querySelector('span').textContent=fmt(hCost());$('bh').disabled=S.gold<hCost();
  $('ba').querySelector('span').textContent=fmt(aCost());$('ba').disabled=S.gold<aCost();
}
function dmg(v,kind){
  if(S.dead)return;
  S.hp-=v;A.hurt=1;
  const p=R().monPos();const fx=$('fx');
  const d=document.createElement('div');d.className='dmg'+(kind?' '+kind:'');d.textContent=(kind==='crit'?'CRIT ':'')+fmt(v);
  d.style.left=(p.x+(Math.random()*50-25))+'px';d.style.top=(p.y+(Math.random()*20))+'px';fx.appendChild(d);setTimeout(()=>d.remove(),900);
  if(kind!=='ally'){const h=document.createElement('div');h.className='hit';h.style.left=(p.x+(Math.random()*20-10))+'px';h.style.top=(p.y+30)+'px';fx.appendChild(h);setTimeout(()=>h.remove(),250)}
  if(S.hp<=0)kill();
  ui();
}
function kill(){
  S.dead=true;A.dying=1;
  const g=Math.round(3*Math.pow(1.45,S.stage-1)*(isBoss()?6:1));
  const p=R().monPos(),fx=$('fx'),sr=$('scene').getBoundingClientRect(),gr=$('gold').getBoundingClientRect();
  for(let i=0;i<6;i++){
    const c=document.createElement('i');c.className='coin fc';c.style.left=(p.x+Math.random()*40-20)+'px';c.style.top=(p.y+40+Math.random()*20)+'px';fx.appendChild(c);
    setTimeout(()=>{c.style.transform=`translate(${gr.left-sr.left-parseFloat(c.style.left)}px,${gr.top-sr.top-parseFloat(c.style.top)}px)`;c.style.opacity=.2},60+i*50);
    setTimeout(()=>c.remove(),900+i*50);
  }
  setTimeout(()=>{S.gold+=g;ui()},700);
  setTimeout(()=>{S.idx++;if(S.idx>10){S.idx=1;S.stage++}spawn()},650);
}
$('scene').addEventListener('pointerdown',e=>{
  $('hint').style.display='none';
  A.hero=1;const c=Math.random()<.12;
  dmg(c?tapDmg()*4:tapDmg(),c?'crit':'');
});
$('bh').onclick=()=>{if(S.gold>=hCost()){S.gold-=hCost();S.hl++;ui()}};
$('ba').onclick=()=>{if(S.gold>=aCost()){S.gold-=aCost();S.al++;ui()}};
let allyTurn=0;
setInterval(()=>{if(S.dead)return;const i=allyTurn++%2;A.ally[i]=1;setTimeout(()=>dmg(allyDmg(),'ally'),180)},800);

/* =========================================================
   RENDU 2D DESSINÉ + PIXEL (même dessin, deux traitements)
   ========================================================= */
let X,PIX=false,OUT=false,FLASH=0;
const OC='#1b1426';
const C=c=>FLASH>0?mixc(c,'#ffffff',FLASH):c;
function edge(){if(OUT){X.lineWidth=2.2;X.strokeStyle=OC;X.lineJoin='round';X.stroke()}}
function rr(x,y,w,h,r,c){X.fillStyle=C(c);X.beginPath();if(X.roundRect)X.roundRect(x,y,w,h,r);else X.rect(x,y,w,h);X.fill();edge()}
function circ(x,y,r,c,noedge){X.fillStyle=C(c);X.beginPath();X.arc(x,y,r,0,7);X.fill();if(!noedge)edge()}
function ell(x,y,rx,ry,c,noedge){X.fillStyle=C(c);X.beginPath();X.ellipse(x,y,rx,ry,0,0,7);X.fill();if(!noedge)edge()}
function poly(p,c,noedge){X.fillStyle=C(c);X.beginPath();X.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)X.lineTo(p[i],p[i+1]);X.closePath();X.fill();if(!noedge)edge()}
function glow(c,b){if(!PIX){X.shadowColor=c;X.shadowBlur=b}}
function nog(){X.shadowBlur=0}
function skyGrad(a,b,y0,y1,bands){
  if(PIX){for(let i=0;i<bands;i++){X.fillStyle=mixc(a,b,i/(bands-1));X.fillRect(0,y0+(y1-y0)*i/bands,W,(y1-y0)/bands+1)}return}
  const g=X.createLinearGradient(0,y0,0,y1);g.addColorStop(0,a);g.addColorStop(1,b);X.fillStyle=g;X.fillRect(0,y0,W,y1-y0);
}

/* ---- décors ---- */
const BG={
trees(t){
  skyGrad(T.sky[0],T.sky[1],0,300,8);
  glow('#fff3b0',30);circ(292,72,22,'#fff4c4',1);nog();
  for(let i=0;i<3;i++){const x=((i*150+t*7)%480)-60,y=50+i*28;X.globalAlpha=PIX?1:.9;circ(x,y,14,'#ffffff',1);circ(x+16,y-6,17,'#ffffff',1);circ(x+34,y,13,'#ffffff',1);ell(x+16,y+6,30,8,'#ffffff',1);X.globalAlpha=1}
  poly([0,232,40,178,80,210,135,150,190,212,240,168,300,205,360,160,360,270,0,270],T.far,1);
  poly([135,150,147,166,140,170,128,165],'#eef4ff',1);poly([360,160,350,172,340,170],'#eef4ff',1);
  ell(285,262,85,40,shade(T.mid,-.1),1);
  // château
  const cx=258,cy=232;
  rr(cx,cy-30,60,32,0,'#8590b0');rr(cx-8,cy-52,16,54,0,'#9aa4c2');rr(cx+52,cy-52,16,54,0,'#9aa4c2');rr(cx+22,cy-66,18,68,0,'#a9b2cf');
  poly([cx-11,cy-52,cx,cy-72,cx+11,cy-52],'#3c4f96',1);poly([cx+49,cy-52,cx+60,cy-72,cx+71,cy-52],'#3c4f96',1);poly([cx+19,cy-66,cx+31,cy-92,cx+43,cy-66],'#3c4f96',1);
  rr(cx+26,cy-12,10,14,4,'#3b2b22');poly([cx+31,cy-92,cx+31,cy-104,cx+42,cy-99],'#e0443a',1);
  ell(70,282,170,48,T.mid,1);
  const r=rng(7);
  for(let i=0;i<13;i++){const x=i*30+r()*14-10,y=292+r()*8,s=.8+r()*.5;
    rr(x-3*s,y-14*s,6*s,16*s,1,'#6b4a2b');circ(x,y-24*s,13*s,'#2f6b32',1);circ(x-6*s,y-18*s,10*s,'#3b7d3a',1);circ(x+6*s,y-30*s,8*s,'#4a9447',1)}
  X.fillStyle=T.ground;X.fillRect(0,300,W,H-300);
  poly([150,300,210,300,280,H,80,H],'#c9a36a',1);poly([162,300,198,300,240,H,120,H],'#d8b47b',1);
  const g=rng(3);for(let i=0;i<40;i++){const x=g()*W,y=305+g()*95;X.fillStyle=g()>.5?'#3f7a30':'#64a84c';X.fillRect(x,y,2,4)}
},
city(t){
  skyGrad(T.sky[0],T.sky[1],0,300,8);
  const s=rng(11);X.fillStyle='#fff';for(let i=0;i<40;i++){X.globalAlpha=.4+s()*.6;X.fillRect(s()*W,s()*160,1.5,1.5)}X.globalAlpha=1;
  // soleil synthwave
  glow('#ff3cac',40);circ(180,190,62,'#ff5ca8',1);nog();
  X.fillStyle=T.sky[1];for(let i=0;i<6;i++)X.fillRect(110,195+i*9,140,2+i*.8);
  const r=rng(5);
  for(let i=0;i<16;i++){const w=18+r()*26,h=60+r()*120,x=i*24-10;rr(x,290-h,w,h,0,'#1e1442');
    for(let wy=290-h+8;wy<282;wy+=9)for(let wx=x+4;wx<x+w-4;wx+=7){if(r()>.62){X.fillStyle=r()>.5?'#2ee6ff':'#ff4fb8';X.globalAlpha=.75;X.fillRect(wx,wy,3,4);X.globalAlpha=1}}}
  for(let i=0;i<8;i++){const w=34+r()*30,h=40+r()*80,x=i*50-20;rr(x,300-h,w,h,0,'#120a28');glow(i%2?'#ff3cac':'#28f0ff',10);X.fillStyle=i%2?'#ff3cac':'#28f0ff';X.fillRect(x,300-h,w,2);nog()}
  glow('#28f0ff',14);rr(48,186,62,22,4,'#0b0620');X.fillStyle='#28f0ff';X.font='900 16px system-ui';X.textAlign='center';X.fillText('NOVA',79,203);nog();
  X.fillStyle=T.ground;X.fillRect(0,300,W,H-300);
  X.strokeStyle='#28f0ff';X.lineWidth=PIX?2:1.2;glow('#28f0ff',8);
  for(let i=0;i<9;i++){const y=300+Math.pow(i/8,1.8)*100+((t*20)%12)*(i/8);X.globalAlpha=.25+i*.07;X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke()}
  for(let i=-8;i<=8;i++){X.globalAlpha=.45;X.beginPath();X.moveTo(180+i*14,300);X.lineTo(180+i*70,H);X.stroke()}
  X.globalAlpha=1;nog();
},
crystal(t){
  skyGrad(T.sky[0],T.sky[1],0,300,8);
  const s=rng(13);X.fillStyle='#fff';for(let i=0;i<25;i++){X.globalAlpha=.3+s()*.6;X.fillRect(s()*W,s()*120,1.5,1.5)}X.globalAlpha=1;
  glow('#ffffff',25);circ(80,70,26,'#f4ecff',1);nog();circ(118,48,9,'#ffd7c2',1);
  const isl=(x,y,w)=>{poly([x-w,y,x+w,y,x,y+w*1.3],'#4a3a78',1);ell(x,y,w,w*.28,'#6a58a8',1);rr(x-4,y-28,8,28,2,'#c9c2e8');glow('#36e8ff',10);circ(x,y-31,4,'#36e8ff',1);nog()};
  isl(260,110+Math.sin(t)*4,30);isl(170,150+Math.sin(t+2)*4,18);
  poly([0,250,60,200,120,240,190,190,260,236,320,196,360,220,360,280,0,280],T.far,1);
  const cr=(x,h,w,c)=>{glow(c,16);poly([x,300-h,x+w,300-h*.6,x+w*.6,300,x-w*.6,300,x-w,300-h*.6],c,1);nog();poly([x,300-h,x+w*.3,300-h*.6,x,300],'rgba(255,255,255,.35)',1)};
  cr(30,90,14,'#36e8ff');cr(330,70,12,'#ff5ce1');cr(300,40,9,'#36e8ff');cr(62,50,9,'#a77bff');
  // tours techno
  const tw=(x,h)=>{rr(x-8,300-h,16,h,2,'#2a2250');for(let y=300-h+10;y<298;y+=18){glow('#36e8ff',8);X.fillStyle='#36e8ff';X.fillRect(x-8,y,16,2);nog()}poly([x-10,300-h,x,300-h-18,x+10,300-h],'#3c3172',1)};
  tw(110,110);tw(240,80);
  X.fillStyle=T.ground;X.fillRect(0,300,W,H-300);
  X.strokeStyle='#4c3e78';X.lineWidth=1.5;for(let i=0;i<5;i++){X.beginPath();X.moveTo(0,312+i*20);X.lineTo(W,312+i*20);X.stroke()}
  glow('#36e8ff',10);X.strokeStyle='#36e8ff';X.lineWidth=PIX?2:1.4;X.beginPath();X.moveTo(40,310);X.lineTo(70,330);X.lineTo(64,352);X.moveTo(300,320);X.lineTo(280,345);X.lineTo(296,372);X.stroke();nog();
}
};

/* ---- personnages ---- */
function weapon(d,big){

    case'sword':G(box(.26,.05,.08),M('#d6a521'),0,0,0,w);G(box(.07,.85,.03),g?gm2(g):M('#e2e8f0'),0,-.47,0,w);break;
    case'katana':G(box(.16,.04,.06),M('#222'),0,0,0,w);G(box(.04,1,.025),gm2(g),0,-.52,0,w);break;
    case'staff':G(cyl(.03,.03,1.3,6),M('#6d4524'),0,-.25,0,w);G(sph(.11),gm2(g),0,-.92,0,w);break;
    case'bow':{const b=G(new THREE.TorusGeometry(.38,.025,6,16,Math.PI*.8),M('#8a5a2b'),0,-.1,0,w);b.rotation.z=Math.PI*.6;b.rotation.y=Math.PI/2;break}
    case'gun':G(box(.1,.5,.12),M('#2a2e3c'),0,-.25,0,w);G(box(.105,.06,.125),gm2(g),0,-.15,0,w);break;
    case'hammer':G(cyl(.03,.03,.8,6),M('#5a3a22'),0,-.35,0,w);G(box(.4,.24,.24),M('#8d95a8'),0,-.78,0,w);G(box(.41,.05,.25),gm2(g),0,-.78,0,w);break;
    case'club':G(cyl(.06,.13,.6,6),M('#7a5230'),0,-.3,0,w);break;
    case'claw':for(let i=-1;i<=1;i++){const c=G(cone(.03,.2,4),M('#c9d2e3'),i*.06,-.1,0,w);c.rotation.x=Math.PI}break;
    }
  }
  function hum3(d,mon){
    const g=new THREE.Group(),bd=d.body,dk=shade(bd,-.35),sk=d.skin||bd,mb=M(bd),md=M(dk);
    [-.12,.12].forEach(x=>{G(box(.17,.55,.2),md,x,.28,0,g);G(box(.19,.1,.28),M('#3a2a20'),x,.05,.04,g)});
    G(cyl(.25,.3,.62,10),mb,0,.86,0,g);G(cyl(.31,.31,.08,10),M('#4a3324'),0,.6,0,g);
    if(d.metal&&d.head!=='visor')G(box(.36,.3,.1),M(d.metal),0,.98,.22,g);
    if(d.cape){const c=G(box(.5,.85,.03),M(d.cape),0,.78,-.3,g);c.rotation.x=.12}
    const hd=new THREE.Group();hd.position.y=1.42;g.add(hd);
    G(sph(.24),M(sk),0,0,0,hd);
    const eye=d.eye||'#222',ge=new THREE.MeshBasicMaterial({color:new THREE.Color(eye)});
    const eyes=()=>[-.08,.08].forEach(x=>G(sph(.035,8,6),mon?ge:M(eye),x,.02,.21,hd));
    switch(d.head){
    case'helmet':{const h=G(new THREE.SphereGeometry(.27,16,12,0,Math.PI*2,0,Math.PI*.55),M(d.metal),0,.02,0,hd);G(box(.3,.05,.06),d.glow?new THREE.MeshBasicMaterial({color:new THREE.Color(d.glow)}):M('#262a35'),0,0,.24,hd);if(d.cape)G(sph(.07),M(d.cape),0,.3,0,hd);break}
    case'hat':G(cone(.28,.6,12),mb,0,.42,0,hd);G(cyl(.4,.4,.03,16),md,0,.15,0,hd);if(d.glow)G(sph(.05),new THREE.MeshBasicMaterial({color:new THREE.Color(d.glow)}),0,.72,0,hd);eyes();break;
    case'hood':G(sph(.29),md,0,.03,-.04,hd).scale.z=.95;eyes();break;
    case'visor':for(let i=0;i<5;i++){const s=G(cone(.08,.25,5),M(d.hair),-.16+i*.08,.24,-.05,hd);s.rotation.x=-.4}G(box(.4,.08,.1),new THREE.MeshBasicMaterial({color:new THREE.Color(d.glow)}),0,.03,.2,hd);break;
    case'hairpink':G(new THREE.SphereGeometry(.27,16,12,0,Math.PI*2,0,Math.PI*.5),M(d.hair),0,.02,-.02,hd);G(box(.3,.4,.12),M(d.hair),0,-.15,-.2,hd);eyes();break;
    case'android':G(box(.38,.06,.08),new THREE.MeshBasicMaterial({color:new THREE.Color(d.glow)}),0,.03,.21,hd);G(cyl(.015,.015,.25,4),M('#888'),.1,.3,0,hd);G(sph(.04),new THREE.MeshBasicMaterial({color:new THREE.Color(d.glow)}),.1,.43,0,hd);break;
    case'ears':[-1,1].forEach(s=>{const e=G(cone(.07,.3,4),M(sk),s*.26,.08,0,hd);e.rotation.z=-s*1.2});eyes();break;
    case'skull':eyes();G(box(.18,.05,.05),M('#cfc8b0'),0,-.13,.2,hd);break;
    case'horns':G(new THREE.SphereGeometry(.26,16,12,0,Math.PI*2,0,Math.PI*.6),md,0,.02,0,hd);[-1,1].forEach(s=>{const h=G(cone(.06,.35,6),M('#d8d0c0'),s*.17,.3,0,hd);h.rotation.z=-s*.4});G(box(.3,.05,.06),ge,0,0,.23,hd);break;
    default:eyes();
    }
    G(box(.12,.48,.12),md,.36,.86,0,g);
    const arm=new THREE.Group();arm.position.set(-.36,1.08,0);g.add(arm);
    G(box(.13,.5,.13),mb,0,-.24,0,arm);G(sph(.08),M(sk),0,-.5,0,arm);
    const hand=new THREE.Group();hand.position.y=-.5;arm.add(hand);weapon3(d,hand);
    g.userData.arm=arm;g.userData.head=hd;
    return g;
  }
  function mon3(d){
    const g=new THREE.Group(),c=d.color,dk=shade(c,-.3),e=d.eye;
    const ge=new THREE.MeshBasicMaterial({color:new THREE.Color(e)});
    let h=1;
    switch(d.kind){
    case'blob':{const b=G(sph(.6,20,14),M(c),0,.42,0,g);b.scale.set(1,.75,1);[-1,1].forEach(s=>{G(sph(.13,10,8),M('#ffffff'),s*.2,.6,.45,g);G(sph(.06,8,6),M(e),s*.2,.6,.56,g)});h=.9;break}
    case'biped':{const m=hum3({body:c,skin:shade(c,.15),head:d.head,weapon:d.weapon,eye:e,glow:e},true);m.scale.setScalar(1.12);g.add(m);g.userData.arm=m.userData.arm;h=1.8;break}
    case'beast':{
      const b=G(sph(.75,20,14),M(c),0,1,0,g);b.scale.set(1.4,.85,1);
      G(sph(.55,16,12),M(d.belly,d.glowy?d.belly:null,.4),0,.85,.32,g).scale.set(1.1,.7,.7);
      [[-.5,.45],[.5,.45],[-.5,-.45],[.5,-.45]].forEach(([x,z])=>G(cyl(.15,.18,.7,8),M(dk),x,.35,z,g));
      const n=G(cyl(.2,.3,1,10),M(c),-.95,1.6,0,g);n.rotation.z=.7;
      const hd=new THREE.Group();hd.position.set(-1.35,2.05,0);g.add(hd);
      G(box(.6,.36,.42),M(c),0,0,0,hd);G(box(.4,.12,.34),M(c),-.36,-.12,0,hd);
      [-1,1].forEach(s=>{const hh=G(cone(.06,.4,6),M('#e8dcc0'),.15,.3,s*.14,hd);hh.rotation.z=.6;G(sph(.06,8,6),ge,-.15,.08,s*.2,hd)});
      const tl=G(cone(.25,1.6,8),M(c),1.6,.95,0,g);tl.rotation.z=1.75;
      const wg=[];[-1,1].forEach(s=>{const w=new THREE.Group();w.position.set(.1,1.5,s*.4);const sh=new THREE.Shape();sh.moveTo(0,0);sh.lineTo(-.4,1.4);sh.lineTo(.6,1.6);sh.lineTo(1.2,.6);sh.lineTo(.6,0);
        const wm=new THREE.Mesh(new THREE.ShapeGeometry(sh),new THREE.MeshToonMaterial({color:new THREE.Color(dk),gradientMap:gm,side:THREE.DoubleSide}));wm.castShadow=true;w.add(wm);w.rotation.x=s*.9;g.add(w);wg.push([w,s])});
      g.userData.wings=wg;h=2.5;break}
    case'drone':{const b=new THREE.Group();b.position.y=1.5;g.add(b);
      G(cyl(.6,.5,.25,20),M(c),0,0,0,b);G(new THREE.SphereGeometry(.38,16,10,0,Math.PI*2,0,Math.PI/2),M(shade(c,.25)),0,.12,0,b);
      G(sph(.16),ge,0,0,.55,b);G(cyl(.02,.02,.35,4),M('#999'),0,.6,0,b);G(sph(.06),ge,0,.8,0,b);
      [-1,1].forEach(s=>{G(box(.3,.14,.2),M(dk),s*.75,0,0,b);G(cyl(.08,.02,.2,8),ge,s*.75,-.15,0,b)});
      G(cyl(.22,.05,.12,12),ge,0,-.2,0,b);g.userData.float=b;h=2.2;break}
    case'mech':{
      [-.35,.35].forEach(x=>{G(box(.25,.9,.3),M(dk),x,.45,0,g);G(box(.35,.12,.5),M(dk),x,.06,.05,g)});
      G(box(1.15,.95,.85),M(c),0,1.38,0,g);G(box(.6,.16,.05),ge,0,1.55,.44,g);
      G(box(.25,.6,.25),M(dk),.72,1.3,0,g);const cn=G(cyl(.1,.1,.7,8),M(dk),-.75,1.85,.1,g);cn.rotation.x=Math.PI/2;G(sph(.07),ge,-.75,1.85,.47,g);
      if(d.big){G(box(1.2,.08,.9),new THREE.MeshBasicMaterial({color:0xffb000}),0,1.05,0,g);G(box(.2,.4,.2),M(dk),.4,2.05,0,g)}
      h=2.1;break}
    case'golem':{
      [-.3,.3].forEach(x=>G(box(.3,.75,.35),M(dk),x,.38,0,g));
      G(new THREE.DodecahedronGeometry(.7,0),M(c),0,1.35,0,g).scale.set(1,1.1,.85);
      [-1,1].forEach(s=>G(new THREE.DodecahedronGeometry(.3,0),M(dk),s*.85,1.1,0,g).scale.set(.8,1.6,.8));
      G(new THREE.DodecahedronGeometry(.34,0),M(c),0,2.2,0,g);
      [-1,1].forEach(s=>G(box(.1,.05,.05),ge,s*.12,2.25,.3,g));
      [[0,2.6,0,1],[.45,1.9,.1,.7],[-.5,1.7,.2,.6]].forEach(([x,y,z,s])=>{const o=G(new THREE.OctahedronGeometry(.18,0),M(d.crystal,d.crystal,.8),x,y,z,g);o.scale.set(.6*s,1.8*s,.6*s)});
      h=2.7;break}
    }
    if(d.kind==='beast'){const sub=new THREE.Group();while(g.children.length)sub.add(g.children[0]);sub.scale.setScalar(.7);sub.position.x=.3;g.add(sub);h*=.7}
    g.userData.h=h;
    const mats=[];g.traverse(o=>{if(o.isMesh&&o.material.isMeshToonMaterial){mats.push([o.material,o.material.emissive.clone()])}});g.userData.mats=mats;
    return g;
  }
  const hero=hum3(T.hero);hero.position.set(-.9,0,.3);hero.rotation.y=.6;sc.add(hero);
  const al=T.allies.map((d,i)=>{const a=hum3(d);a.scale.setScalar(.85);a.position.set(i?-2.3:-2.9,0,i?1.0:-.9);a.rotation.y=.55;sc.add(a);return a});
  let mon=null,monDef=null;
  function setMon(){
    if(mon){sc.remove(mon);mon.traverse(o=>{if(o.geometry)o.geometry.dispose()})}
    monDef=S.mon;mon=mon3(S.mon);mon.rotation.y=-.6;mon.position.set(1.5,0,0);sc.add(mon);
  }
  const white=new THREE.Color(1,1,1),tmp=new THREE.Color();
  function armAnim(o,atk,ph){if(!o.userData.arm)return;const p=1-atk;o.userData.arm.rotation.x=atk>0?(2.8-Math.min(1,p*1.6)*3.9):(-.55+Math.sin(A.t*3+ph)*.06)}
  return{
    resize(){const r=$('scene').getBoundingClientRect();rd.setSize(r.width,r.height,false);cam.aspect=r.width/r.height;cam.updateProjectionMatrix()},
    monPos(){if(!mon)return{x:CW*.7,y:CH*.4};const s=mon.scale.y||1;const v=new THREE.Vector3(1.5,(mon.userData.h)*Math.max(s,.6)+.15,0).project(cam);return{x:(v.x+1)/2*CW,y:Math.max(60,(1-v.y)/2*CH)}},
    draw(){
      if(monDef!==S.mon)setMon();
      const t=A.t;anim.forEach(f=>f(t));
      const hp=1-A.hero;hero.position.x=-.9+(A.hero>0?Math.sin(hp*Math.PI)*1.15:0);hero.position.y=Math.abs(Math.sin(t*4))*.03;armAnim(hero,A.hero,0);
      al.forEach((a,i)=>{a.position.y=Math.abs(Math.sin(t*4+i+1))*.03;armAnim(a,A.ally[i],i+1)});
      const k=monScale();mon.visible=k>.02;mon.scale.set(k*(1+A.hurt*.12),k*(1-A.hurt*.12),k*(1+A.hurt*.12));
      mon.position.x=1.5+(A.hurt>0?Math.sin(t*90)*.05*A.hurt:0);mon.position.y=A.dying>0?-(1-A.dying)*.5:0;
      armAnim(mon,0,3);
      if(mon.userData.float)mon.userData.float.position.y=1.5+Math.sin(t*3)*.12;
      if(mon.userData.wings)mon.userData.wings.forEach(([w,s])=>w.rotation.x=s*(.6+Math.sin(t*6)*.4));
      mon.userData.mats.forEach(([m,o])=>{m.emissive.copy(o).lerp(white,A.hurt*.7)});
      rd.render(sc,cam);
    }
  };
}

/* ---------- boucle + modes ---------- */
const R=()=>S.mode==='3d'&&R3?R3:S.mode==='px'?RP:R2;
function setMode(m){
  if(m==='3d'&&!R3){if(typeof THREE==='undefined'){$('err').style.display='flex';return}try{R3=make3D();R3.resize()}catch(e){$('err').style.display='flex';$('err').textContent='3D indisponible : '+e.message;return}}
  $('err').style.display='none';
  S.mode=m;document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  cv.style.display=m==='3d'?'none':'block';$('three').style.display=m==='3d'?'block':'none';
}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;A.t+=dt;
  A.hero=Math.max(0,A.hero-dt*4);A.ally=A.ally.map(v=>Math.max(0,v-dt*3.5));A.hurt=Math.max(0,A.hurt-dt*6);
  if(A.dying>0)A.dying=Math.max(0.001,A.dying-dt*2.2);if(A.spawn<1)A.spawn=Math.min(1,A.spawn+dt*3);
  R().draw();
  requestAnimationFrame(loop);
}
$('uni').textContent=T.name;$('gname').textContent=T.game;
$('fiche').innerHTML=`<p>${T.pitch}</p><p><b>Héros :</b> ${T.hero.name} · <b>Alliés :</b> ${T.allies.map(a=>a.name).join(', ')}</p><p><b>Ennemis :</b> ${T.monsters.map(m=>m.name).join(', ')} · <b>Boss :</b> ${T.boss.name}</p><p style="opacity:.65;font-size:12px">Aperçu de style : ici la progression est accélérée pour voir les ennemis et le boss. La version finale sera un farm long et dur.</p>`;
addEventListener('resize',resize);resize();spawn();
const qm=location.hash.slice(1);if(['3d','px','2d'].includes(qm))setMode(qm);
requestAnimationFrame(loop);
</script>
