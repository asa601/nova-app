 <div id="pills" style="display:flex;gap:5px;flex-wrap:wrap;align-items:center"></div>

<script>
const $=id=>document.getElementById(id);
/* ---------- utilitaires ---------- */
const UNITS=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','UDc','DDc','TDc','QaDc','QiDc','SxDc','SpDc','OcDc','NoDc','Vg'];
function F(n){if(!isFinite(n))return'∞';if(n<1000)return n<10&&n%1?(Math.floor(n*10)/10).toString().replace('.',','):Math.floor(n)+'';const e=Math.floor(Math.log10(n)/3);if(e>=UNITS.length)return n.toExponential(2).replace('+','');const v=n/Math.pow(1000,e);return(v<10?v.toFixed(2):v<100?v.toFixed(1):v.toFixed(0)).replace('.',',')+UNITS[e]}
function toast(m,c){const t=$('toast');t.textContent=m;t.style.color=c||'#fff';t.style.opacity=1;t.style.transform='translateX(-50%) scale(1.15)';setTimeout(()=>t.style.transform='translateX(-50%) scale(1)',120);clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,1600)}
function modal(h,btns){$('mc').innerHTML=h+'<div style="display:flex;gap:8px;justify-content:center;margin-top:14px" id="mb"></div>';const mb=$('mb');(btns||[['OK',null,'blue']]).forEach(([l,f,c])=>{const b=document.createElement('button');b.className='btn '+(c||'blue');b.textContent=l;b.onclick=()=>{$('modal').style.display='none';f&&f()};mb.appendChild(b)});$('modal').style.display='flex'}
/* ---------- son ---------- */
let AC=null,SND=true;try{SND=localStorage.getItem('rb_snd')!=='0'}catch(e){}
function beep(f,d=.08,type='square',v=.06){if(!SND)return;try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function chord(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.18,'triangle',.07),i*70))}
$('snd').onclick=()=>{SND=!SND;$('snd').textContent=SND?'🔊':'🔇';try{localStorage.setItem('rb_snd',SND?'1':'0')}catch(e){}};$('snd').textContent=SND?'🔊':'🔇';
/* ---------- scène ---------- */
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio||1,2));$('app').prepend(R.domElement);
const SC=new THREE.Scene();SC.background=new THREE.Color('#8fd3ff');SC.fog=new THREE.Fog('#a8dcff',40,110);
const CAM=new THREE.PerspectiveCamera(78,1,.1,300);
SC.add(new THREE.HemisphereLight(0xffffff,0x5a8a3a,.85));const SUN=new THREE.DirectionalLight(0xffffff,.75);SUN.position.set(20,40,15);SC.add(SUN);
const lam=c=>new THREE.MeshLambertMaterial({color:new THREE.Color(c)});
const basic=c=>new THREE.MeshBasicMaterial({color:new THREE.Color(c)});
function canvasTex(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');f&&f(x,w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return{t,c,x}}
function studTex(base,dark){return canvasTex(64,64,(x,w,h)=>{x.fillStyle=base;x.fillRect(0,0,w,h);x.fillStyle=dark;x.beginPath();x.arc(32,32,13,0,7);x.fill();x.fillStyle='rgba(255,255,255,.18)';x.beginPath();x.arc(29,28,9,0,7);x.fill();x.strokeStyle='rgba(0,0,0,.08)';x.strokeRect(0,0,w,h)})}
function box(w,h,d,c,x,y,z,par){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),typeof c==='string'?lam(c):c);m.position.set(x,y,z);(par||SC).add(m);return m}
// ciel : soleil + nuages
const sun=new THREE.Mesh(new THREE.SphereGeometry(6,16,12),basic('#fff6c4'));sun.position.set(60,70,-90);SC.add(sun);
for(let k=0;k<14;k++){const c=new THREE.Group();const m=basic('#ffffff');for(let j=0;j<4;j++){box(4+Math.random()*4,2,3+Math.random()*3,m,j*3-4.5,Math.random(),Math.random()*2,c)}c.position.set((Math.random()-.5)*200,28+Math.random()*12,(Math.random()-.5)*200);SC.add(c)}
// sol
function makeGround(W,L,cz){const g=studTex('#4caf50','#45a148');g.t.wrapS=g.t.wrapT=THREE.RepeatWrapping;g.t.repeat.set(W/2,L/2);const f=new THREE.Mesh(new THREE.PlaneGeometry(W,L),new THREE.MeshLambertMaterial({map:g.t}));f.rotation.x=-Math.PI/2;f.position.z=cz||0;SC.add(f);
  const o=studTex('#3d8f40','#388a3b');o.t.wrapS=o.t.wrapT=THREE.RepeatWrapping;o.t.repeat.set(150,150);const of=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshLambertMaterial({map:o.t}));of.rotation.x=-Math.PI/2;of.position.y=-.03;SC.add(of);
  // clôture
  const fm=lam('#b5651d');const hx=W/2,hz=L/2;
  for(let x=-hx;x<=hx;x+=2){box(.3,1.2,.3,fm,x,.6,cz-hz);box(.3,1.2,.3,fm,x,.6,cz+hz)}for(let z=-hz;z<=hz;z+=2){box(.3,1.2,.3,fm,-hx,.6,cz+z);box(.3,1.2,.3,fm,hx,.6,cz+z)}
  box(W,.2,.15,fm,0,.9,cz-hz);box(W,.2,.15,fm,0,.9,cz+hz);box(.15,.2,L,fm,-hx,.9,cz);box(.15,.2,L,fm,hx,.9,cz);
  // arbres hors du terrain
  for(let k=0;k<40;k++){const a=Math.random()*7,r=Math.max(W,L)/2+6+Math.random()*30;const x=Math.cos(a)*r,z=cz+Math.sin(a)*r;box(.8,3,.8,'#8b5a2b',x,1.5,z);box(3.2,3.2,3.2,k%3?'#2e8b3a':'#3cab48',x,4.4,z)}}
/* ---------- panneaux & boutons ---------- */
function makePad(x,z,w,info){const p={x,z,w,press:0,key:''};
  p.mat=lam('#888');p.mesh=new THREE.Mesh(new THREE.BoxGeometry(w,.35,w),p.mat);p.mesh.position.set(x,.18,z);SC.add(p.mesh);
  p.rim=box(w+.5,.16,w+.5,'#3a3a46',x,.08,z);
  const s=canvasTex(256,160);p.sx=s;p.sign=new THREE.Mesh(new THREE.PlaneGeometry(1.9,1.19),new THREE.MeshBasicMaterial({map:s.t,transparent:true}));p.sign.position.set(x,3.1,z);SC.add(p.sign);
  return p}
function signDraw(p,title,sub,can,lv,col,done){const key=title+'|'+sub+'|'+can+'|'+lv+'|'+col+'|'+done;if(p.key===key)return;p.key=key;const x=p.sx.x,w=256,h=160;x.clearRect(0,0,w,h);
  x.fillStyle=done?'#2a6a3a':'#24324f';x.beginPath();x.roundRect(6,6,w-12,h-12,22);x.fill();x.lineWidth=8;x.strokeStyle=done?'#2ecc40':can?col:'#ff4136';x.stroke();
  x.textAlign='center';x.fillStyle='#fff';x.font='700 40px Fredoka,system-ui';x.fillText(title,w/2,62);
  if(sub){x.font='700 34px Fredoka,system-ui';x.fillStyle=can?'#7dff8a':'#ff8a80';x.fillText(sub,w/2,110)}
  if(lv){x.font='500 22px Fredoka,system-ui';x.fillStyle='rgba(255,255,255,.7)';x.fillText(lv,w/2,142)}
  p.sx.t.needsUpdate=true}
function padVisual(p,col,on,vis,dt){p.mesh.visible=p.rim.visible=vis;const dd=Math.hypot(CAM.position.x-p.x,CAM.position.z-p.z);p.sign.visible=vis&&dd>3.4;p.sign.material.opacity=Math.min(1,(dd-3.4)/2.5);if(!vis)return;p.mat.color.set(col);if(on)p.mat.color.offsetHSL(0,0,.12);p.press=Math.max(0,p.press-dt*6);p.mesh.position.y=.18-(on?.1:0)-p.press*.1;p.sign.rotation.set(0,Math.atan2(CAM.position.x-p.x,CAM.position.z-p.z),0)}
/* ---------- texte flottant & confettis ---------- */
const V3=new THREE.Vector3();
function floatAt(x,y,z,txt,col,big){V3.set(x,y,z).project(CAM);if(V3.z>1)return;const fl=$('fls');if(fl.children.length>30)return;const d=document.createElement('div');d.className='fl';d.textContent=txt;d.style.color=col||'#fff';if(big)d.style.fontSize='28px';d.style.left=((V3.x+1)/2*innerWidth)+'px';d.style.top=((1-V3.y)/2*innerHeight)+'px';fl.appendChild(d);setTimeout(()=>d.remove(),1000)}
const CONF=[];const cgeo=new THREE.BoxGeometry(.18,.18,.18);const CC=['#ff4136','#2ecc40','#0074d9','#ffdc00','#b10dc9','#ff851b'].map(c=>basic(c));
for(let k=0;k<90;k++){const m=new THREE.Mesh(cgeo,CC[k%6]);m.visible=false;SC.add(m);CONF.push({m,t:0})}
function confetti(x,y,z,n=20){let c=0;for(const p of CONF){if(p.t>0)continue;p.t=1+Math.random()*.6;p.m.visible=true;p.m.position.set(x,y,z);p.v=new THREE.Vector3((Math.random()-.5)*7,4+Math.random()*6,(Math.random()-.5)*7);if(++c>=n)break}}
function updConf(dt){for(const p of CONF){if(p.t<=0)continue;p.t-=dt;p.v.y-=18*dt;p.m.position.addScaledVector(p.v,dt);p.m.rotation.x+=dt*8;p.m.rotation.y+=dt*6;if(p.m.position.y<.1){p.m.position.y=.1;p.v.set(0,0,0)}if(p.t<=0)p.m.visible=false}}
/* ---------- joueur & contrôles ---------- */
const P={x:0,z:0,yaw:Math.PI,pitch:-.25,minx:-20,maxx:20,minz:-20,maxz:20};
const WALLS=[];// {x0,x1,z0,z1,on()}
let mv=null,lk=null;const keys={};let onTap=null;
R.domElement.addEventListener('pointerdown',e=>{$('hint').style.opacity=0;if(SND&&!AC)beep(1,.01,'sine',0);
  if(e.clientX<innerWidth*.45&&!mv){mv={id:e.pointerId,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY};const j=$('joy');j.style.display='block';j.style.left=e.clientX+'px';j.style.top=e.clientY+'px';j.firstChild.style.transform=''}
  else if(!lk){lk={id:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:performance.now()}}});
addEventListener('pointermove',e=>{if(mv&&e.pointerId===mv.id){mv.x=e.clientX;mv.y=e.clientY;let dx=mv.x-mv.x0,dy=mv.y-mv.y0;const n=Math.hypot(dx,dy);if(n>50){dx*=50/n;dy*=50/n}$('joy').firstChild.style.transform=`translate(${dx}px,${dy}px)`}
  if(lk&&e.pointerId===lk.id){P.yaw-=(e.clientX-lk.x)*.0065;P.pitch=Math.max(-1.25,Math.min(1,P.pitch-(e.clientY-lk.y)*.005));lk.x=e.clientX;lk.y=e.clientY}});
function up(e){if(mv&&e.pointerId===mv.id){mv=null;$('joy').style.display='none'}if(lk&&e.pointerId===lk.id){if(onTap&&Math.hypot(e.clientX-lk.sx,e.clientY-lk.sy)<10&&performance.now()-lk.t<300)onTap(e.clientX,e.clientY);lk=null}}
addEventListener('pointerup',up);addEventListener('pointercancel',up);
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function moveP(dt){let fx=0,fz=0;
  if(mv){let dx=(mv.x-mv.x0)/50,dy=(mv.y-mv.y0)/50;const n=Math.hypot(dx,dy);if(n>1){dx/=n;dy/=n}if(n>.12){fx=-dy;fz=dx}}
  if(keys.z||keys.w||keys.arrowup)fx=1;if(keys.s||keys.arrowdown)fx=-1;if(keys.q||keys.a)fz=-1;if(keys.d)fz=1;
  const sp=8,sy=Math.sin(P.yaw),cy=Math.cos(P.yaw);const nx=P.x+(-sy*fx+cy*fz)*sp*dt,nz=P.z+(-cy*fx-sy*fz)*sp*dt;
  const hit=(x,z)=>WALLS.some(w=>w.on()&&x>w.x0-.4&&x<w.x1+.4&&z>w.z0-.4&&z<w.z1+.4);
  if(!hit(nx,P.z))P.x=nx;if(!hit(P.x,nz))P.z=nz;
  P.x=Math.max(P.minx,Math.min(P.maxx,P.x));P.z=Math.max(P.minz,Math.min(P.maxz,P.z));
  P.bob=(P.bob||0)+(fx||fz?dt*10:0);
  CAM.position.set(P.x,1.75+Math.sin(P.bob)*.05,P.z);CAM.rotation.order='YXZ';CAM.rotation.y=P.yaw;CAM.rotation.x=P.pitch}
/* mur verrouillé avec panneau */
function lockWall(x0,x1,z0,z1,text,on){const w={x0,x1,z0,z1,on};WALLS.push(w);
  const t=canvasTex(512,128,(x,W,H)=>{x.fillStyle='rgba(255,65,54,.35)';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.font='700 56px Fredoka,system-ui';x.textAlign='center';x.fillText('🔒 '+text,W/2,84)});
  const m=new THREE.Mesh(new THREE.BoxGeometry(Math.max(.3,x1-x0),3,Math.max(.3,z1-z0)),(()=>{const T=new THREE.MeshLambertMaterial({map:t.t,transparent:true,opacity:.92}),Rd=lam('#c0392b'),alongZ=(z1-z0)>(x1-x0);return alongZ?[T,T,Rd,Rd,Rd,Rd]:[Rd,Rd,Rd,Rd,T,T]})());
  m.position.set((x0+x1)/2,1.5,(z0+z1)/2);SC.add(m);w.mesh=m;return w}
function zoneSign(x,z,text,col,ry){const t=canvasTex(512,110,(c,W,H)=>{c.fillStyle=col;c.beginPath();c.roundRect(4,4,W-8,H-8,24);c.fill();c.fillStyle='#fff';c.font='700 60px Fredoka,system-ui';c.textAlign='center';c.lineWidth=8;c.strokeStyle='#0004';c.strokeText(text,W/2,76);c.fillText(text,W/2,76)});
  const m=new THREE.Mesh(new THREE.PlaneGeometry(8,1.72),new THREE.MeshBasicMaterial({map:t.t,transparent:true,side:THREE.DoubleSide}));m.position.set(x,5,z);m.rotation.y=ry||0;SC.add(m);
  box(.25,4.2,.25,'#5a3a1a',x-3.6,2.1,z);box(.25,4.2,.25,'#5a3a1a',x+3.6,2.1,z);return m}
function resize(){R.setSize(innerWidth,innerHeight,false);CAM.aspect=innerWidth/innerHeight;CAM.fov=innerWidth<innerHeight?80:62;CAM.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
function setPills(list){$('pills').innerHTML=list.map(([id,c,ic,fc])=>`<div class="pill" id="${id}w" style="border-color:${c}"><span class="i" style="background:${c};color:${fc||'#fff'}">${ic}</span><span id="${id}"></span></div>`).join('')}
/* ================= NOVA DROPPER ================= */
makeGround(44,66,12);P.minx=-21;P.maxx=21;P.minz=-21;P.maxz=45;
/* ===== économie Nova Dropper (sans DOM) ===== */
const LAY=[
 {k:'mult',n:'Multiplicateur',ic:'✖️',col:'#0074d9',b:2,C0:2e4},
 {k:'rb',n:'Rebirth',ic:'♻️',col:'#ff851b',b:1,C0:40},
 {k:'sup',n:'Super Rebirth',ic:'🌟',col:'#e6a800',b:1,C0:100},
 {k:'asc',n:'Ascension',ic:'🌌',col:'#7a3cff',b:1,C0:40},
 {k:'tra',n:'Transcendance',ic:'☄️',col:'#ff3cac',b:1,C0:10},
 {k:'ete',n:'Éternité',ic:'👑',col:'#00b894',b:1,C0:6},
];
const GM=2.5,CM=5.5,GROW=1.15;
const NL=LAY.length;
const CRY=[{n:'Valeur',d:'+25 % valeur',ic:'💰'},{n:'Vitesse',d:'+12 % vitesse auto',ic:'⚡'},{n:'Gain prestige',d:'+20 % de tous les gains',ic:'📈'},{n:'Cube doré',d:'+1 % de chance',ic:'⭐'},{n:'Hors-ligne',d:'+10 % gains hors-ligne',ic:'🌙'}];

  const was=onPad;onPad=null;for(const p of PADS){if(!vis(p.zone))continue;if(Math.abs(P.x-p.x)<1.3&&Math.abs(P.z-p.z)<1.3){onPad=p;break}}
  if(onPad!==was){buyT=0;holdN=0}
  if(onPad){buyT-=dt;if(buyT<=0){const ok=buy(onPad);holdN++;const k=onPad.k;buyT=(k==='val'||k==='spd'||k==='cu')?Math.max(.05,.3-holdN*.025):.8;
    if(!ok&&holdN===1){const I=info(onPad);if(!I.max&&!I.lock&&isFinite(I.c))toast('Il manque '+F(I.c-have(I.cur))+' '+curName(I.cur),'#ff8a80')}}}
  for(const p of PADS){const v=vis(p.zone);const I=v?info(p):null;const can=I&&!I.max&&!I.lock&&have(I.cur)>=I.c;
    padVisual(p,I&&I.max?'#7f8a9c':can?ZC[p.zone]:'#5a6478',onPad===p,v,dt);
    if(v&&Math.hypot(P.x-p.x,P.z-p.z)<26)signDraw(p,I.t,I.max?'MAX':I.lock?'':F(I.c)+' '+curName(I.cur),can,I.lv,ZC[p.zone],I.max)}
  LAY.forEach((L,k)=>{const Z=ZPOS[k];if(Z.lock){Z.lock.visible=!unlocked(k);Z.lock.rotation.y=Math.atan2(CAM.position.x-Z.x,CAM.position.z-Z.z)}});
  WALLS.forEach(w=>{if(w.mesh)w.mesh.visible=w.on()});
  updConf(dt);flashT=Math.max(0,flashT-dt*2);$('flash').style.opacity=flashT*.7;
}
let last=performance.now(),hT=0,sT=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;step(dt);R.render(SC,CAM);hT+=dt;sT+=dt;if(hT>.1){hT=0;hud()}if(sT>3){sT=0;save()}requestAnimationFrame(loop)}
P.x=1.5;P.z=-8;P.yaw=Math.PI;P.pitch=-.06;rebuild();
(()=>{const off=Math.min(4*3600,(Date.now()-S.last)/1000),inc=incomeEst();if(off>60&&inc>0){const g=inc*off*crOff();S.cash+=g;S.tot+=g;setTimeout(()=>modal(`<h2>🌙 Pendant ton absence</h2><p>Tes droppers ont tourné ${Math.round(off/60)} min</p><p style="font-size:26px;color:#7dff8a;font-weight:700">+${F(g)} $</p>`),300)}})();
$('reset').onclick=()=>modal('<h2>Tout recommencer ?</h2><p>Ta sauvegarde sera effacée.</p>',[['Annuler',null,'gray'],['Effacer',()=>{S=freshS();rebuild();save()},'red']]);
if(!S.tot)setTimeout(()=>modal('<h2>🏭 Nova Dropper</h2><p>Appuie sur <b>DROP</b> (ou touche un dropper) pour lâcher des cubes dans la caisse.<br><br>Marche sur les <b>boutons au sol</b> pour acheter. Si tu restes dessus, ça achète en boucle.<br><br>Les paliers : ✖️ → ♻️ → 🌟 → 🌌 → ☄️ → 👑<br>Chaque palier automatise celui situé 2 crans en dessous. Le bouton 🗺️ te téléporte d\'une zone à l\'autre.</p>',[['C\'est parti !',null,'red']]),300);
requestAnimationFrame(loop);
